<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Fun</title>
<meta name="theme-color" content="#2b6cb0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff7ec; --card:#ffffff; --ink:#26303f; --soft:#6b7385; --line:#eadfcf;
  --sky:#2b6cb0; --sky-soft:#e3efff; --sun:#f6b93b; --sun-soft:#fff1d1;
  --good:#2f9e5b; --good-soft:#e2f6ea; --bad:#d9534f; --bad-soft:#fde8e7;
  --lock:#d8d2c8; --face:#fffdf8; --hand-h:#26303f; --hand-m:#d9534f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161b24; --card:#202734; --ink:#eef2f8; --soft:#a8b1c2; --line:#323b4b;
    --sky:#6aa7ec; --sky-soft:#1f3350; --sun:#f6c45e; --sun-soft:#3a2f17;
    --good:#5ccc8a; --good-soft:#173324; --bad:#f07c78; --bad-soft:#3d1f1e;
    --lock:#3a4252; --face:#2a3242; --hand-h:#eef2f8; --hand-m:#f07c78;
  }
}
:root[data-theme="dark"]{
  --bg:#161b24; --card:#202734; --ink:#eef2f8; --soft:#a8b1c2; --line:#323b4b;
  --sky:#6aa7ec; --sky-soft:#1f3350; --sun:#f6c45e; --sun-soft:#3a2f17;
  --good:#5ccc8a; --good-soft:#173324; --bad:#f07c78; --bad-soft:#3d1f1e;
  --lock:#3a4252; --face:#2a3242; --hand-h:#eef2f8; --hand-m:#f07c78;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font:800 22px/1.35 "Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.screen{display:none}.screen.on{display:block}
button{font:inherit;color:inherit;cursor:pointer}

/* home */
.hello{display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px}
.hello h1{margin:0;font-size:1.6rem;font-weight:900}
.count{background:var(--sun-soft);border-radius:999px;padding:6px 14px;font-size:1rem}
.today{background:var(--sky);color:#fff;border-radius:28px;padding:22px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.today .small{font-size:1rem;opacity:.9}
.today .em{font-size:4.2rem;line-height:1.1;margin:8px 0}
.today .name{font-size:1.5rem;font-weight:900}
.today button{margin-top:16px;width:100%;border:0;border-radius:20px;padding:18px;font-size:1.5rem;font-weight:900;background:#fff;color:var(--sky)}
.today.rest{background:var(--good)}
.today.rest button{color:var(--good)}
h2.sec{font-size:1.1rem;color:var(--soft);margin:24px 4px 10px}
.path{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stop{aspect-ratio:1;border-radius:50%;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.9rem;background:var(--card);box-shadow:0 4px 0 var(--line)}
.stop small{font-size:.75rem;color:var(--soft)}
.stop.done{background:var(--sun-soft)}
.stop.now{background:var(--sky-soft);outline:4px solid var(--sky);animation:pulse 1.6s infinite}
.stop.lock{background:var(--lock);font-size:1.2rem;opacity:.7}
@keyframes pulse{50%{transform:scale(1.06)}}
.grown{display:block;margin:28px auto 0;border:0;background:none;color:var(--soft);font-size:.95rem;padding:10px}

/* lesson */
.top{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.x{border:0;background:var(--card);border-radius:50%;width:48px;height:48px;font-size:1.4rem;box-shadow:0 3px 0 var(--line);flex:none}
.dots{flex:1;display:flex;gap:6px}
.dots i{flex:1;height:12px;border-radius:6px;background:var(--line)}
.dots i.on{background:var(--sun)}
.card{background:var(--card);border-radius:28px;padding:22px 18px;text-align:center;box-shadow:0 6px 0 var(--line);min-height:300px}
.big-em{font-size:5rem;line-height:1.1;margin:4px 0 10px}
.say{font-size:1.45rem;font-weight:900;margin:8px 0}
.speak{border:0;background:var(--sky-soft);border-radius:999px;padding:8px 16px;font-size:1rem;margin-top:6px}
.vis{margin:6px auto 10px}
.vis svg{width:190px;height:190px}
.digital{display:inline-block;background:#1d2533;color:#7CFFB2;font:900 3.2rem/1 "Courier New",monospace;padding:14px 22px;border-radius:16px;letter-spacing:2px}
.digital small{font-size:1.2rem;margin-left:8px;color:#b9ffd8}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0}
.week span{background:var(--bg);border-radius:10px;padding:8px 0;font-size:.85rem}
.week span.hl{background:var(--sun);color:#26303f}
.hours{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-width:300px;margin:0 auto}
.hours span{border-radius:8px;padding:4px 0;font-size:.8rem}
.hours span.d{background:var(--sun-soft)}
.hours span.n{background:var(--sky-soft)}
.opts{display:grid;gap:12px;margin-top:16px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{border:4px solid var(--line);background:var(--card);border-radius:22px;padding:16px 10px;font-size:1.3rem;font-weight:900;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 4px 0 var(--line)}
.opt .oi{font-size:2.4rem;line-height:1}
.opt .oi svg{width:96px;height:96px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.6}
.opt:disabled{cursor:default}
.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:52px;margin:10px 0}
.slots span{background:var(--good-soft);border:3px solid var(--good);border-radius:14px;padding:6px 12px;font-size:1.05rem}
.slots .hint{color:var(--soft);font-size:1rem;border:0;background:none}
.fb{margin-top:14px;border-radius:20px;padding:14px;font-size:1.25rem}
.fb.good{background:var(--good-soft);border:3px solid var(--good)}
.fb.try{background:var(--sun-soft);border:3px solid var(--sun)}
.next{display:block;width:100%;margin-top:16px;border:0;border-radius:22px;padding:20px;font-size:1.5rem;font-weight:900;background:var(--good);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* finish */
.win{text-align:center;padding-top:30px}
.win .sticker{font-size:7rem;line-height:1;animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.win h1{font-size:2rem;margin:10px 0}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-40px;font-style:normal;font-size:1.8rem;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}

/* grown-ups */
#g{font:600 17px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
#g h2{font-size:1.25rem;margin:0 0 8px}
#g .box{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 3px 0 var(--line)}
#g label{display:block;margin:8px 0 4px;font-weight:700}
#g input[type=text]{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
#g .chk{display:flex;gap:10px;align-items:center;font-weight:600}
#g .chk input{width:22px;height:22px}
#g .b{border:0;border-radius:12px;padding:10px 16px;font-weight:800;background:var(--sky);color:#fff;margin:10px 8px 0 0}
#g .b.ghost{background:none;border:2px solid var(--sky);color:var(--sky)}
#g .b.red{background:none;border:2px solid var(--bad);color:var(--bad)}
#g table{width:100%;border-collapse:collapse;font-size:.95rem}
#g td,#g th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
#g .note{color:var(--soft);font-size:.95rem}
</style>
</head>
<body>
<div class="wrap">

<!-- HOME -->
<section class="screen on" id="home">
  <div class="hello"><h1 id="hi">Hi! 👋</h1><span class="count" id="count"></span></div>
  <div class="today" id="todayCard"></div>
  <h2 class="sec">My time journey</h2>
  <div class="path" id="path"></div>
  <button class="grown" id="grownBtn">⚙️ Grown-ups (hold)</button>
</section>

<!-- LESSON -->
<section class="screen" id="lesson">
  <div class="top"><button class="x" id="quit" aria-label="Go home">🏠</button><div class="dots" id="dots"></div></div>
  <div class="card" id="stage"></div>
</section>

<!-- FINISH -->
<section class="screen" id="finish">
  <div class="win">
    <div class="sticker" id="winSticker"></div>
    <h1 id="winTitle">You did it!</h1>
    <p id="winText"></p>
    <button class="next" id="winHome">🏠 Home</button>
  </div>
</section>

<!-- GROWN-UPS -->
<section class="screen" id="g">
  <div class="box">
    <h2>Settings</h2>
    <label for="gName">His name</label>
    <input type="text" id="gName" placeholder="e.g. Aran">
    <label class="chk" style="margin-top:12px"><input type="checkbox" id="gOne"> Only one new lesson per day</label>
    <button class="b" id="gSave">Save</button>
    <button class="b ghost" id="gUnlock">Unlock next lesson now</button>
    <div class="note" id="gMsg"></div>
  </div>
  <div class="box">
    <h2>Progress</h2>
    <p class="note">"First try" = questions he got right on the first tap. Repeat lessons with low scores.</p>
    <div id="gTable"></div>
  </div>
  <div class="box">
    <button class="b red" id="gReset">Start over (erase progress)</button>
  </div>
  <button class="b" id="gBack">← Back</button>
</section>

</div>
<div class="confetti" id="confetti"></div>

<script>
(function(){
"use strict";

/* ---------- helpers ---------- */
function $(id){ return document.getElementById(id); }
function el(t,c,h){ var e=document.createElement(t); if(c) e.className=c; if(h!==undefined) e.innerHTML=h; return e; }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function pad(n){ return (n<10?"0":"")+n; }
function today(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t; } return a; }
function say(t){
  try{ if(!window.speechSynthesis) return; speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(String(t).replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,"")); u.rate=.85; speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- storage ---------- */
var KEY="timeFun.v1";
function blank(){ return {name:"",done:{},newDate:"",oneADay:true}; }
var S=(function(){ try{ var r=localStorage.getItem(KEY); return r?Object.assign(blank(),JSON.parse(r)):blank(); }catch(e){ return blank(); } })();
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }

/* ---------- pictures ---------- */
function clockSVG(h,m){
  var s="<svg viewBox='0 0 200 200' role='img' aria-label='clock'>";
  s+="<circle cx='100' cy='100' r='94' fill='var(--face)' stroke='var(--ink)' stroke-width='6'/>";
  for(var i=1;i<=12;i++){ var a=i*Math.PI/6; s+="<text x='"+(100+74*Math.sin(a)).toFixed(1)+"' y='"+(100-74*Math.cos(a)+8).toFixed(1)+"' text-anchor='middle' font-size='22' font-weight='900' fill='var(--ink)' font-family='Nunito,sans-serif'>"+i+"</text>"; }
  var ha=((h%12)+m/60)*30*Math.PI/180, ma=m*6*Math.PI/180;
  s+="<line x1='100' y1='100' x2='"+(100+44*Math.sin(ha)).toFixed(1)+"' y2='"+(100-44*Math.cos(ha)).toFixed(1)+"' stroke='var(--hand-h)' stroke-width='10' stroke-linecap='round'/>";
  s+="<line x1='100' y1='100' x2='"+(100+66*Math.sin(ma)).toFixed(1)+"' y2='"+(100-66*Math.cos(ma)).toFixed(1)+"' stroke='var(--hand-m)' stroke-width='6' stroke-linecap='round'/>";
  return s+"<circle cx='100' cy='100' r='7' fill='var(--ink)'/></svg>";
}
var DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
function vis(v){
  if(!v) return "";
  if(v.clock) return "<div class='vis'>"+clockSVG(v.clock[0],v.clock[1])+"</div>";
  if(v.digital) return "<div class='vis'><span class='digital'>"+v.digital[0]+":"+pad(v.digital[1])+(v.ap?"<small>"+v.ap+"</small>":"")+"</span></div>";
  if(v.week){ return "<div class='week'>"+DAYS.map(function(d,i){ return "<span class='"+(v.week.indexOf(i)>=0?"hl":"")+"'>"+d.slice(0,3)+"</span>"; }).join("")+"</div>"; }
  if(v.hours){ var h=""; for(var i=1;i<=24;i++){ h+="<span class='"+(i>=7&&i<=20?"d":"n")+"'>"+i+"</span>"; } return "<div class='vis hours'>"+h+"</div><div style='font-size:1rem;color:var(--soft)'>☀️ day hours &nbsp; 🌙 night hours</div>"; }
  return "";
}
function icon(i){ if(i && typeof i==="object" && i.clock) return clockSVG(i.clock[0],i.clock[1]); return i?esc(i):""; }

/* ---------- lessons ---------- */
/* L = learn card; P = pick the answer (first option is correct, shown shuffled); O = tap in order */
function L(e,txt,v){ return {k:"L",e:e,txt:txt,v:v}; }
function P(q,opts,yes,v){ return {k:"P",q:q,o:opts,yes:yes,v:v}; }
function O(q,opts,yes){ return {k:"O",q:q,o:opts,yes:yes}; }

function buildLessons(){
  var d=new Date(), wd=(d.getDay()+6)%7, tom=(wd+1)%7, yes=(wd+6)%7;
  return [
  {t:"Parts of the day",e:"🌅",s:[
    L("🌅","Every day has parts: morning, afternoon, evening and night."),
    L("☀️","Morning is when we wake up and go to school."),
    P("When do you wake up?",[["🌅","Morning"],["🌙","Night"]],"Yes! We wake up in the morning."),
    P("When is it dark and we sleep?",[["🌙","Night"],["☀️","Afternoon"]],"Yes! We sleep at night."),
    P("When does the bus bring you home?",[["🚌","Afternoon"],["🌅","Early morning"]],"Yes! The bus brings you home in the afternoon.")]},
  {t:"The day in order",e:"🔄",s:[
    L("🔄","The day goes in order: morning, afternoon, evening, night. Then a new day starts."),
    O("Put the day in order.",[["🌅","Morning"],["☀️","Afternoon"],["🌆","Evening"],["🌙","Night"]],"Great! Morning, afternoon, evening, night."),
    P("What comes after morning?",[["☀️","Afternoon"],["🌙","Night"]],"Yes! Afternoon comes after morning."),
    P("What comes after night?",[["🌅","Morning"],["🌆","Evening"]],"Yes! After night, a new morning comes.")]},
  {t:"Day and night",e:"🌗",s:[
    L("☀️","Day is when the sun is up. It is light outside."),
    L("🌙","Night is when the sun is down. It is dark outside."),
    L("🌗","One day and one night together make one whole day."),
    P("Is school in the day or at night?",[["☀️","Day"],["🌙","Night"]],"Yes! School is in the day."),
    P("When do you sleep?",[["🌙","Night"],["☀️","Day"]],"Yes! We sleep at night."),
    P("Day and night together make...",[["📅","One whole day"],["⏱️","One minute"]],"Yes! Day and night make one whole day.")]},
  {t:"24 hours",e:"🕛",s:[
    L("🕛","One whole day has 24 hours.",{hours:1}),
    L("🛏️","From waking up today to waking up tomorrow is about 24 hours."),
    P("How many hours are in one day?",[["","24"],["","10"],["","100"]],"Yes! One day has 24 hours."),
    P("From wake up today to wake up tomorrow is...",[["📅","One day"],["⏱️","One minute"]],"Yes! That is one whole day."),
    P("One more time! Hours in a day?",[["","24"],["","12"]],"Yes! 24 hours in a day.")]},
  {t:"How long is an hour?",e:"⏳",s:[
    L("📺","An hour is long. Two TV shows are about one hour."),
    L("🎬","A movie is about 2 hours."),
    L("🪥","Brushing teeth is only 2 minutes. Much shorter than an hour!"),
    P("Which is about one hour?",[["📺","Two TV shows"],["🪥","Brushing teeth"]],"Yes! Two TV shows are about one hour."),
    P("Which is longer?",[["🎬","A movie"],["🚗","Car to school"]],"Yes! A movie is about 2 hours."),
    P("Is an hour short or long?",[["🐢","Long"],["⚡","Short"]],"Yes! An hour is long.")]},
  {t:"The clock",e:"🕒",s:[
    L("🕒","A clock shows us the time. It has the numbers 1 to 12.",{clock:[3,0]}),
    L("👆","The short hand shows the hour. The long hand shows the minutes.",{clock:[3,0]}),
    P("Which hand shows the hour?",[["⬛","Short hand"],["🟥","Long hand"]],"Yes! The short hand shows the hour."),
    P("What is the biggest number on the clock?",[["","12"],["","24"]],"Yes! The clock goes up to 12.")]},
  {t:"O'clock",e:"🕖",s:[
    L("🕖","When the long hand points to 12, it is o'clock. This is 7 o'clock.",{clock:[7,0]}),
    L("🕒","Short hand on 3. Long hand on 12. It is 3 o'clock.",{clock:[3,0]}),
    P("What time is it?",[["","8 o'clock"],["","12 o'clock"],["","4 o'clock"]],"Yes! It is 8 o'clock.",{clock:[8,0]}),
    P("What time is it?",[["","2 o'clock"],["","12 o'clock"],["","6 o'clock"]],"Yes! It is 2 o'clock.",{clock:[2,0]}),
    P("What time is it?",[["","11 o'clock"],["","1 o'clock"]],"Yes! It is 11 o'clock.",{clock:[11,0]})]},
  {t:"Digital clock",e:"🔢",s:[
    L("📱","A digital clock shows numbers. 7:00 means 7 o'clock.",{digital:[7,0]}),
    L("👀","The number before the dots is the hour.",{digital:[9,0]}),
    P("What time is it?",[["","8 o'clock"],["","10 o'clock"]],"Yes! 8:00 is 8 o'clock.",{digital:[8,0]}),
    P("Which clock shows the same time?",[[{clock:[4,0]},""],[{clock:[9,0]},""]],"Yes! Both say 4 o'clock.",{digital:[4,0]}),
    P("What time is it?",[["","12 o'clock"],["","2 o'clock"]],"Yes! 12:00 is 12 o'clock.",{digital:[12,0]})]},
  {t:"AM and PM",e:"🌞",s:[
    L("🔁","The clock goes to 12. But a day has 24 hours. So the clock goes around 2 times every day."),
    L("🌞","AM is the morning.",{digital:[7,0],ap:"AM"}),
    L("🌙","PM is the afternoon, evening and night.",{digital:[9,0],ap:"PM"}),
    P("You wake up at 7:00...",[["🌞","AM"],["🌙","PM"]],"Yes! Morning is AM."),
    P("You go to bed at 9:00...",[["🌙","PM"],["🌞","AM"]],"Yes! Night is PM."),
    P("How many times does the clock go around in one day?",[["","2 times"],["","10 times"]],"Yes! 2 times. 12 and 12 make 24.")]},
  {t:"Minutes",e:"⏱️",s:[
    L("⏱️","An hour is made of minutes. One hour has 60 minutes."),
    L("🪥","A minute is short. Brushing your teeth takes about 2 minutes."),
    P("How many minutes are in one hour?",[["","60"],["","24"],["","12"]],"Yes! 60 minutes in one hour."),
    P("Which is shorter?",[["⏱️","1 minute"],["⏳","1 hour"]],"Yes! A minute is shorter than an hour."),
    P("Brushing teeth takes about...",[["⏱️","2 minutes"],["⏳","2 hours"]],"Yes! About 2 minutes.")]},
  {t:"Getting ready",e:"🎒",s:[
    L("🎒","You get ready for school in about 20 minutes. Great job!"),
    L("⏳","20 minutes is shorter than one hour. Getting ready 3 times is about one hour."),
    P("Getting ready takes about...",[["⏱️","20 minutes"],["⏳","20 hours"]],"Yes! About 20 minutes."),
    P("Which takes longer?",[["🎒","Getting ready"],["🪥","Brushing teeth"]],"Yes! Getting ready takes longer."),
    P("Is getting ready shorter or longer than an hour?",[["⚡","Shorter"],["🐢","Longer"]],"Yes! 20 minutes is shorter than an hour.")]},
  {t:"Car and bus",e:"🚗",s:[
    L("🚗","School is 1 mile away. The car ride takes about 5 minutes."),
    L("🚌","The bus home takes longer. It stops to let other kids get off."),
    P("The car ride to school takes about...",[["⏱️","5 minutes"],["⏳","5 hours"]],"Yes! About 5 minutes."),
    P("Which is faster?",[["🚗","Car to school"],["🚌","Bus home"]],"Yes! The car is faster."),
    P("Why is the bus slower?",[["🛑","It makes stops"],["😴","The bus is tired"]],"Yes! The bus stops for other kids.")]},
  {t:"Half past",e:"🕢",s:[
    L("🕢","When the long hand points to 6, it is half past. This is half past 7.",{clock:[7,30]}),
    L("📱","Half past 7 is 7:30. 30 minutes is half an hour.",{digital:[7,30]}),
    P("What time is it?",[["","Half past 3"],["","3 o'clock"]],"Yes! Half past 3.",{clock:[3,30]}),
    P("What time is it?",[["","Half past 9"],["","9 o'clock"]],"Yes! 9:30 is half past 9.",{digital:[9,30]}),
    P("Half an hour is how many minutes?",[["","30"],["","60"]],"Yes! Half an hour is 30 minutes.")]},
  {t:"Minutes or hours?",e:"⚖️",s:[
    L("⚖️","Some things take minutes. Some things take hours."),
    P("Brushing teeth takes...",[["⏱️","Minutes"],["⏳","Hours"]],"Yes! Just minutes."),
    P("Watching a movie takes...",[["⏳","Hours"],["⏱️","Minutes"]],"Yes! About 2 hours."),
    P("Car to school takes...",[["⏱️","Minutes"],["⏳","Hours"]],"Yes! About 5 minutes."),
    P("Sleeping at night takes...",[["⏳","Hours"],["⏱️","Minutes"]],"Yes! We sleep for many hours."),
    P("A school day takes...",[["⏳","Hours"],["⏱️","Minutes"]],"Yes! School is many hours.")]},
  {t:"Small to big",e:"📏",s:[
    L("👏","A second is very quick. Clap your hands! That is about 1 second."),
    L("📏","Second, minute, hour, day. Each one is bigger than the one before."),
    O("Put them in order, smallest to biggest.",[["👏","Second"],["⏱️","Minute"],["⏳","Hour"],["📅","Day"]],"Great! Second, minute, hour, day."),
    P("Which is the biggest?",[["📅","Day"],["⏱️","Minute"]],"Yes! A day is the biggest."),
    P("Which is the smallest?",[["👏","Second"],["⏳","Hour"]],"Yes! A second is the smallest.")]},
  {t:"Days of the week",e:"📅",s:[
    L("📅","A week has 7 days.",{week:[0,1,2,3,4,5,6]}),
    L("🗓️","Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday.",{week:[0,1,2,3,4,5,6]}),
    P("How many days are in a week?",[["","7"],["","24"],["","5"]],"Yes! 7 days in a week."),
    O("Put the days in order.",[["","Monday"],["","Tuesday"],["","Wednesday"],["","Thursday"]],"Great! Monday, Tuesday, Wednesday, Thursday."),
    P("What comes after Friday?",[["","Saturday"],["","Monday"]],"Yes! Saturday comes after Friday.")]},
  {t:"School days and weekend",e:"🏫",s:[
    L("🏫","Monday to Friday are school days. That is 5 days.",{week:[0,1,2,3,4]}),
    L("🎉","Saturday and Sunday are the weekend. No school!",{week:[5,6]}),
    P("Is Saturday a school day?",[["🎉","No"],["🏫","Yes"]],"Right! Saturday is the weekend."),
    P("How many school days are in a week?",[["","5"],["","7"]],"Yes! 5 school days."),
    P("Which day is the weekend?",[["","Sunday"],["","Wednesday"]],"Yes! Sunday is the weekend.")]},
  {t:"Yesterday, today, tomorrow",e:"🗓️",s:[
    L("👉","Today is now. Yesterday was the day before. Tomorrow is the day after."),
    L("🗓️","If today is Monday, tomorrow is Tuesday. Yesterday was Sunday.",{week:[0]}),
    P("If today is Tuesday, tomorrow is...",[["","Wednesday"],["","Monday"]],"Yes! Wednesday."),
    P("If today is Friday, yesterday was...",[["","Thursday"],["","Saturday"]],"Yes! Thursday."),
    P("Which comes first?",[["⬅️","Yesterday"],["➡️","Tomorrow"]],"Yes! Yesterday comes first.")]},
  {t:"What day is today?",e:"📆",s:[
    L("📆","Today is "+DAYS[wd]+".",{week:[wd]}),
    P("What day is today?",[["",DAYS[wd]],["",DAYS[(wd+3)%7]]],"Yes! Today is "+DAYS[wd]+".",{week:[wd]}),
    P("What day is tomorrow?",[["",DAYS[tom]],["",DAYS[yes]]],"Yes! Tomorrow is "+DAYS[tom]+"."),
    P("Is today a school day?",wd<5?[["🏫","Yes"],["🎉","No"]]:[["🎉","No"],["🏫","Yes"]],wd<5?"Yes! "+DAYS[wd]+" is a school day.":"Right! "+DAYS[wd]+" is the weekend.")]},
  {t:"Before and after",e:"↔️",s:[
    L("↔️","Some things happen before. Some things happen after."),
    L("🎒","First you get ready. After that, you go to school."),
    P("What do you do before school?",[["🎒","Get ready"],["🚌","Bus home"]],"Yes! You get ready before school."),
    P("What happens after school?",[["🚌","Bus home"],["🛏️","Wake up"]],"Yes! After school, the bus brings you home."),
    O("Put your day in order.",[["🛏️","Wake up"],["🎒","Get ready"],["🚗","Car to school"],["🚌","Bus home"]],"Great! That is your day in order.")]},
  {t:"Same number, AM or PM",e:"🍽️",s:[
    L("🥣","Breakfast at 7:00 AM is in the morning.",{digital:[7,0],ap:"AM"}),
    L("🍽️","Dinner at 7:00 PM is in the evening. Same number, different time!",{digital:[7,0],ap:"PM"}),
    P("Breakfast is at 7:00...",[["🌞","AM"],["🌙","PM"]],"Yes! Breakfast is AM."),
    P("Dinner is at 7:00...",[["🌙","PM"],["🌞","AM"]],"Yes! Dinner is PM."),
    P("3:00 PM is in the...",[["☀️","Afternoon"],["🌙","Middle of the night"]],"Yes! 3 PM is the afternoon.",{digital:[3,0],ap:"PM"})]},
  {t:"One hour later",e:"⏰",s:[
    L("⏰","Every hour, the short hand moves to the next number.",{clock:[2,0]}),
    P("It is 2 o'clock. One hour later it is...",[["","3 o'clock"],["","1 o'clock"]],"Yes! 3 o'clock.",{clock:[2,0]}),
    P("It is 5 o'clock. Two hours later it is...",[["","7 o'clock"],["","6 o'clock"]],"Yes! 7 o'clock.",{clock:[5,0]}),
    P("It is 11 o'clock. One hour later it is...",[["","12 o'clock"],["","10 o'clock"]],"Yes! 12 o'clock.",{clock:[11,0]})]},
  {t:"Time review",e:"🔁",s:[
    L("🔁","Let's remember what you learned!"),
    P("Hours in one day?",[["","24"],["","60"]],"Yes! 24 hours."),
    P("Minutes in one hour?",[["","60"],["","24"]],"Yes! 60 minutes."),
    P("Days in one week?",[["","7"],["","12"]],"Yes! 7 days."),
    P("What time is it?",[["","Half past 4"],["","4 o'clock"]],"Yes! Half past 4.",{clock:[4,30]}),
    P("You eat breakfast in the...",[["🌞","AM"],["🌙","PM"]],"Yes! Morning is AM.")]},
  {t:"Time champion",e:"🏆",s:[
    L("🏆","Last lesson! Show what you know."),
    O("Smallest to biggest.",[["👏","Second"],["⏱️","Minute"],["⏳","Hour"],["📅","Day"],["🗓️","Week"]],"Amazing! Second, minute, hour, day, week."),
    P("What time is it?",[["","10 o'clock"],["","2 o'clock"]],"Yes! 10 o'clock.",{clock:[10,0]}),
    P("Getting ready takes about...",[["⏱️","20 minutes"],["⏳","2 hours"]],"Yes! About 20 minutes."),
    P("Which takes longer?",[["🚌","Bus home"],["🚗","Car to school"]],"Yes! The bus makes stops."),
    O("Put the day in order.",[["🌅","Morning"],["☀️","Afternoon"],["🌆","Evening"],["🌙","Night"]],"You are a Time Champion!")]}
  ];
}
var LESSONS=buildLessons();

/* ---------- navigation ---------- */
function go(id){ [].forEach.call(document.querySelectorAll(".screen"),function(s){ s.classList.toggle("on",s.id===id); }); window.scrollTo(0,0); }
function nextIndex(){ for(var i=0;i<LESSONS.length;i++){ if(!S.done[i]) return i; } return -1; }
function lockedToday(){ return S.oneADay && S.newDate===today(); }

/* ---------- home ---------- */
function renderHome(){
  $("hi").textContent = S.name ? "Hi "+S.name+"! 👋" : "Hi! 👋";
  var n=Object.keys(S.done).length;
  $("count").textContent="⭐ "+n+" / "+LESSONS.length;
  var i=nextIndex(), c=$("todayCard");
  c.className="today"; c.innerHTML="";
  if(i<0){
    c.classList.add("rest");
    c.innerHTML="<div class='em'>🏆</div><div class='name'>You finished every lesson!</div><div class='small'>Tap any sticker to play again.</div>";
  } else if(lockedToday()){
    c.classList.add("rest");
    c.innerHTML="<div class='em'>🌟</div><div class='name'>Great work today!</div><div class='small'>Come back tomorrow for lesson "+(i+1)+".</div>";
    var b=el("button",null,"🔁 Play again"); b.addEventListener("click",function(){ start(i-1>=0?i-1:0); }); c.appendChild(b);
  } else {
    c.innerHTML="<div class='small'>Today's lesson · "+(i+1)+" of "+LESSONS.length+"</div><div class='em'>"+LESSONS[i].e+"</div><div class='name'>"+esc(LESSONS[i].t)+"</div>";
    var s=el("button",null,"▶ Start"); s.addEventListener("click",function(){ start(i); }); c.appendChild(s);
  }
  var p=$("path"); p.innerHTML="";
  LESSONS.forEach(function(L,k){
    var st=el("button","stop"), cls, html;
    if(S.done[k]){ cls="done"; html=L.e+"<small>"+(k+1)+"</small>"; }
    else if(k===i && !lockedToday()){ cls="now"; html=L.e+"<small>"+(k+1)+"</small>"; }
    else { cls="lock"; html="🔒<small>"+(k+1)+"</small>"; }
    st.classList.add(cls); st.innerHTML=html; st.setAttribute("aria-label","Lesson "+(k+1)+": "+L.t);
    st.addEventListener("click",function(){
      if(cls==="lock"){ st.classList.remove("shake"); void st.offsetWidth; st.classList.add("shake"); return; }
      start(k);
    });
    p.appendChild(st);
  });
}

/* ---------- lesson player ---------- */
var cur=null;
function start(i){ cur={i:i,step:0,first:0,qs:0,missed:false}; go("lesson"); renderStep(); }
$("quit").addEventListener("click",function(){ try{speechSynthesis.cancel();}catch(e){} renderHome(); go("home"); });

function renderStep(){
  var les=LESSONS[cur.i], st=les.s[cur.step], stage=$("stage");
  $("dots").innerHTML=les.s.map(function(_,k){ return "<i class='"+(k<=cur.step?"on":"")+"'></i>"; }).join("");
  stage.innerHTML=""; cur.missed=false;
  var speakText;
  if(st.k==="L"){
    stage.appendChild(el("div","big-em",st.v?"":esc(st.e)));
    if(st.v) stage.appendChild(el("div",null,vis(st.v)));
    stage.appendChild(el("div","say",esc(st.txt)));
    speakText=st.txt;
    addSpeak(stage,speakText);
    var n=el("button","next","Next ▶"); n.addEventListener("click",advance); stage.appendChild(n);
  } else if(st.k==="P"){
    cur.qs++;
    if(st.v) stage.appendChild(el("div",null,vis(st.v)));
    stage.appendChild(el("div","say",esc(st.q)));
    speakText=st.q; addSpeak(stage,speakText);
    var opts=el("div","opts"+(st.o.length===2?" two":"")); stage.appendChild(opts);
    var fb=el("div"); stage.appendChild(fb);
    shuffle(st.o.map(function(o,k){ return {o:o,ok:k===0}; })).forEach(function(x){
      var b=el("button","opt",(x.o[0]?"<span class='oi'>"+icon(x.o[0])+"</span>":"")+(x.o[1]?"<span>"+esc(x.o[1])+"</span>":""));
      b.addEventListener("click",function(){
        if(opts.dataset.done||b.disabled) return;
        if(x.ok){
          opts.dataset.done=1; b.classList.add("right");
          [].forEach.call(opts.children,function(y){ y.disabled=true; });
          if(!cur.missed) cur.first++;
          fb.className="fb good"; fb.textContent="✅ "+st.yes; say(st.yes);
          var n=el("button","next","Next ▶"); n.addEventListener("click",advance); stage.appendChild(n);
          n.scrollIntoView({behavior:"smooth",block:"nearest"});
        } else {
          cur.missed=true; b.classList.add("wrong","shake"); b.disabled=true;
          fb.className="fb try"; fb.textContent="Try again! You can do it."; say("Try again.");
        }
      });
      opts.appendChild(b);
    });
  } else {
    cur.qs++;
    stage.appendChild(el("div","say",esc(st.q)));
    speakText=st.q+" Tap the first one."; addSpeak(stage,speakText);
    var slots=el("div","slots","<span class='hint'>Tap the first one…</span>"); stage.appendChild(slots);
    var box=el("div","opts two"); stage.appendChild(box);
    var fb2=el("div"); stage.appendChild(fb2);
    var k=0;
    shuffle(st.o.map(function(o,idx){ return {o:o,idx:idx}; })).forEach(function(x){
      var b=el("button","opt",(x.o[0]?"<span class='oi'>"+icon(x.o[0])+"</span>":"")+"<span>"+esc(x.o[1])+"</span>");
      b.addEventListener("click",function(){
        if(b.disabled) return;
        if(x.idx===k){
          if(k===0) slots.innerHTML="";
          slots.appendChild(el("span",null,(x.o[0]?esc(x.o[0])+" ":"")+esc(x.o[1])));
          b.disabled=true; b.classList.add("right"); k++; fb2.className=""; fb2.textContent=""; say(x.o[1]);
          if(k===st.o.length){
            if(!cur.missed) cur.first++;
            fb2.className="fb good"; fb2.textContent="✅ "+st.yes; setTimeout(function(){ say(st.yes); },700);
            var n=el("button","next","Next ▶"); n.addEventListener("click",advance); stage.appendChild(n);
          }
        } else {
          cur.missed=true; b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
          fb2.className="fb try"; fb2.textContent="Not yet. Which one comes next?"; say("Not yet.");
        }
      });
      box.appendChild(b);
    });
  }
  say(speakText);
}
function addSpeak(stage,t){ var s=el("button","speak","🔊 Hear it"); s.addEventListener("click",function(){ say(t); }); stage.appendChild(s); }
function advance(){
  cur.step++;
  if(cur.step<LESSONS[cur.i].s.length){ renderStep(); window.scrollTo(0,0); return; }
  finish();
}

/* ---------- finish ---------- */
function finish(){
  var i=cur.i, les=LESSONS[i], wasNew=!S.done[i];
  S.done[i]={first:cur.first,of:cur.qs,date:today()};
  if(wasNew) S.newDate=today();
  save();
  $("winSticker").textContent=les.e;
  var last=nextIndex()<0;
  $("winTitle").textContent= last&&wasNew ? "Time Champion! 🏆" : "You did it!";
  $("winText").textContent= wasNew ? "New sticker: "+les.t+"!" : "Great practice!";
  go("finish"); confetti();
  say((last&&wasNew?"You are a Time Champion! ":"You did it! ")+(wasNew?"You got a new sticker.":"Great practice."));
}
$("winHome").addEventListener("click",function(){ renderHome(); go("home"); });
function confetti(){
  var c=$("confetti"), e=["⭐","🎉","✨","🌟"]; c.innerHTML="";
  for(var k=0;k<24;k++){ var i=el("i",null,e[k%4]); i.style.left=(Math.random()*100)+"%"; i.style.animationDelay=(Math.random()*0.8)+"s"; c.appendChild(i); }
  setTimeout(function(){ c.innerHTML=""; },3600);
}

/* ---------- grown-ups (hold 1.5 s) ---------- */
var holdT=null;
function holdStart(e){ e.preventDefault(); holdT=setTimeout(openGrown,1500); }
function holdEnd(){ clearTimeout(holdT); }
var gb=$("grownBtn");
gb.addEventListener("pointerdown",holdStart); gb.addEventListener("pointerup",holdEnd); gb.addEventListener("pointerleave",holdEnd);
gb.addEventListener("contextmenu",function(e){ e.preventDefault(); });
function openGrown(){
  $("gName").value=S.name; $("gOne").checked=!!S.oneADay; $("gMsg").textContent="";
  var rows=LESSONS.map(function(L,k){
    var d=S.done[k];
    return "<tr><td>"+(k+1)+". "+L.e+" "+esc(L.t)+"</td><td>"+(d?d.first+" / "+d.of:"–")+"</td><td>"+(d?d.date:"")+"</td></tr>";
  }).join("");
  $("gTable").innerHTML="<table><tr><th>Lesson</th><th>First try</th><th>Last done</th></tr>"+rows+"</table>";
  go("g");
}
$("gSave").addEventListener("click",function(){ S.name=$("gName").value.trim(); S.oneADay=$("gOne").checked; save(); $("gMsg").textContent="Saved."; });
$("gUnlock").addEventListener("click",function(){ S.newDate=""; save(); $("gMsg").textContent="The next lesson is unlocked."; });
$("gReset").addEventListener("click",function(){ if(confirm("Erase all progress and start from lesson 1?")){ var n=S.name; S=blank(); S.name=n; save(); openGrown(); } });
$("gBack").addEventListener("click",function(){ renderHome(); go("home"); });

renderHome();
})();
</script>
