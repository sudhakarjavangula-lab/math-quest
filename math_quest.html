<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#17181C;
  --panel:#212226;
  --panel-2:#2C2D33;
  --cyan:#FF7A1A;
  --magenta:#2F8CFF;
  --yellow:#FFD23F;
  --green:#4CD97B;
  --text:#F5F3EE;
  --text-dim:#9A9A9E;
  --danger:#FF4545;
  --radius:22px;
  --paint-color:#FF4545;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:radial-gradient(circle at 50% 0%, #2E2F35 0%, var(--bg-deep) 60%);
  font-family:'Nunito',sans-serif;
  color:var(--text);
  min-height:100vh;
  padding:16px;
}
.display{font-family:'Baloo 2',sans-serif;}
#app{max-width:640px;margin:0 auto;}

/* ---- HUD ---- */
.hud{
  display:flex;align-items:center;gap:10px;
  background:var(--panel);border-radius:18px;
  padding:10px 14px;margin-bottom:14px;
  border:2px solid var(--panel-2);
}
.hud .lvl{
  background:var(--magenta);color:#3A0A22;font-family:'Baloo 2';font-weight:700;
  border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  font-size:15px;flex-shrink:0;box-shadow:0 0 0 3px #ffffff22;
}
.hud .xpwrap{flex:1;min-width:0;}
.hud .xpbar-bg{background:#0E1030;border-radius:10px;height:14px;overflow:hidden;border:1px solid #000;}
.hud .xpbar-fill{background:linear-gradient(90deg,var(--cyan),var(--green));height:100%;transition:width .4s ease;}
.hud .xplabel{font-size:11px;color:var(--text-dim);margin-top:2px;}
.hud .chip{
  display:flex;align-items:center;gap:4px;background:var(--panel-2);
  border-radius:12px;padding:6px 10px;font-family:'Baloo 2';font-size:15px;font-weight:600;flex-shrink:0;
}
.hud .streak-chip{color:var(--yellow);}
.hud .coin-chip{color:var(--yellow);}

/* ---- buttons ---- */
button{font-family:'Nunito',sans-serif;cursor:pointer;border:none;}
.btn{
  background:var(--panel-2);color:var(--text);border-radius:16px;
  padding:14px 20px;font-weight:800;font-size:16px;
  border:2px solid #ffffff18;transition:transform .12s ease, background .15s ease;
}
.btn:active{transform:scale(0.94);}
.btn-primary{background:var(--cyan);color:#052A2D;}
.btn-primary:hover{background:#6ceaf3;}
.btn-magenta{background:var(--magenta);color:#3A0A22;}
.btn-yellow{background:var(--yellow);color:#4A3600;}
.btn-green{background:var(--green);color:#003D22;}
.btn-ghost{background:transparent;border:2px solid #ffffff33;color:var(--text-dim);}
.btn-block{width:100%;display:block;}
.btn-lg{font-size:20px;padding:18px 24px;border-radius:20px;}

/* ---- screens ---- */
.card{
  background:var(--panel);border-radius:var(--radius);
  padding:22px;border:2px solid var(--panel-2);
}
.center{text-align:center;}
h1.title{
  font-family:'Baloo 2';font-size:42px;margin:6px 0 2px;
  background:linear-gradient(90deg,var(--cyan),var(--green));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-align:center;
}
.subtitle{color:var(--text-dim);text-align:center;margin:0 0 20px;font-weight:700;}
.mascot{font-size:70px;line-height:1;text-align:center;margin-bottom:6px;filter:drop-shadow(0 0 14px #00000055);display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;border-radius:50%;box-shadow:0 0 0 5px var(--paint-color);background:#00000022;overflow:hidden;}
.mascot img{width:100%;height:100%;object-fit:cover;object-position:center 15%;border-radius:50%;display:block;}
.mascot-wrap{text-align:center;}
.bubble{
  background:var(--panel-2);border-radius:16px;padding:12px 16px;
  font-weight:700;font-size:15px;text-align:center;margin:0 auto 14px;max-width:90%;
  border:2px solid #ffffff14;
}

/* topic grid */
.topicgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.topicnode{
  background:var(--panel-2);border-radius:18px;padding:14px 10px;text-align:center;
  border:2px solid #ffffff14;transition:transform .12s ease;
}
.topicnode:active{transform:scale(0.95);}
.topicnode .emo{font-size:34px;}
.topicnode .name{font-family:'Baloo 2';font-weight:600;font-size:14px;margin:4px 0 2px;}
.topicnode .stars{font-size:12px;color:var(--yellow);letter-spacing:1px;}
.topicnode.recommended{border-color:var(--cyan);box-shadow:0 0 0 2px var(--cyan);}
.topicnode.locked{opacity:0.4;filter:grayscale(70%);}
.topicnode.locked .stars{color:var(--text-dim);}

/* problem area */
.problembox{text-align:center;margin:10px 0 18px;}
.promptline{font-family:'Baloo 2';font-size:30px;margin-top:10px;}
.bignum{font-family:'Baloo 2';font-size:32px;}
.opchip{color:var(--yellow);}
.opchip.big{font-size:34px;}
.dotrow{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;max-width:220px;}
.dot{font-size:18px;}
.blockvisual{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;}
.blockgroup{text-align:center;}
.blocklabel{font-family:'Baloo 2';font-size:15px;color:var(--text-dim);}
.fruitvisual{display:inline-block;text-align:left;}
.fruitrow{font-size:22px;letter-spacing:2px;}
.cookies{font-size:22px;max-width:280px;margin:0 auto;word-break:break-all;}
.groupline{font-size:13px;color:var(--text-dim);margin-top:4px;}
.fracbar{font-size:26px;letter-spacing:2px;}
.decbar-track{background:#0E1030;border:2px solid #000;border-radius:10px;height:28px;width:220px;margin:8px auto;overflow:hidden;}
.decbar-fill{background:linear-gradient(90deg,var(--green),var(--cyan));height:100%;}

/* keypad */
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:260px;margin:0 auto;}
.key{
  background:var(--panel-2);color:var(--text);font-family:'Baloo 2';font-size:22px;font-weight:600;
  border-radius:14px;padding:14px 0;border:2px solid #ffffff14;
}
.key:active{transform:scale(0.92);}
.answerbox{
  font-family:'Baloo 2';font-size:28px;text-align:center;background:var(--panel-2);
  border-radius:14px;padding:10px;margin:0 auto 12px;max-width:260px;min-height:22px;border:2px solid #ffffff20;
  letter-spacing:1px;
}
.choicegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:320px;margin:0 auto;}

/* feedback */
.feedback{text-align:center;font-family:'Baloo 2';font-size:22px;margin:10px 0;min-height:30px;}
.feedback.good{color:var(--green);}
.feedback.bad{color:var(--danger);}
.floatxp{
  position:absolute;font-family:'Baloo 2';font-weight:700;color:var(--green);font-size:18px;
  animation:floatup 1s ease forwards;pointer-events:none;
}
@keyframes floatup{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(-40px);}}
@keyframes pop{0%{transform:scale(0.7);opacity:0;}60%{transform:scale(1.08);opacity:1;}100%{transform:scale(1);}}
.pop{animation:pop .35s ease;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
.shake{animation:shake .3s ease;}

.modal-bg{position:fixed;inset:0;background:#000000aa;display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
.modal{background:var(--panel);border-radius:22px;padding:24px;max-width:420px;width:100%;border:2px solid var(--panel-2);}
.steplist{text-align:left;margin:14px 0;padding-left:0;list-style:none;}
.steplist li{background:var(--panel-2);border-radius:12px;padding:10px 14px;margin-bottom:8px;font-weight:700;font-size:15px;}

.rowbtns{display:flex;gap:10px;margin-top:10px;}
.rowbtns .btn{flex:1;}

.hiddenscreen{display:none;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.small{font-size:13px;color:var(--text-dim);}
.linkbtn{background:none;color:var(--text-dim);text-decoration:underline;font-weight:700;font-size:13px;}

/* dashboard */
.dashrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.dashbar-track{background:#0E1030;border-radius:8px;height:14px;flex:1;margin:0 10px;overflow:hidden;}
.dashbar-fill{background:var(--cyan);height:100%;}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.statcard{background:var(--panel-2);border-radius:14px;padding:12px;text-align:center;}
.statcard .n{font-family:'Baloo 2';font-size:24px;}
.statcard .l{font-size:12px;color:var(--text-dim);}
.sesslist{max-height:180px;overflow-y:auto;}
.sessrow{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid #ffffff10;}
</style>
</head>

// A topic unlocks once its prerequisite topic reaches the listed tier. null = always unlocked.
const UNLOCK_RULES = {
  counting: null,
  numbersense: null,
  addsub: {topic:'counting', tier:2},
  mult: {topic:'addsub', tier:3},
  div: {topic:'mult', tier:2},
  frac: {topic:'addsub', tier:3},
  money: {topic:'addsub', tier:3},
  word: {topic:'addsub', tier:3},
};
function isTopicUnlocked(id){
  const rule = UNLOCK_RULES[id];
  if(!rule) return true;
  const p = topicProgress[rule.topic];
  return !!(p && p.tier >= rule.tier);
}
function unlockRequirementText(id){
  const rule = UNLOCK_RULES[id];
  if(!rule) return '';
  return `Keep practicing ${TOPIC_MAP[rule.topic].name} to unlock this!`;
}

/* ======================= DAILY CHALLENGE ======================= */
let dailyChallenge = null;
function todayStr(){ return new Date().toISOString().slice(0,10); }
function pickDailyTopic(){
  const unlocked = TOPICS.filter(t=>isTopicUnlocked(t.id));
  if(unlocked.length===0) return TOPICS[0].id;
  const seed = todayStr().split('-').reduce((a,c)=>a+parseInt(c,10),0);
  return unlocked[seed % unlocked.length].id;
}
async function loadDaily(){
  const stored = await Store.getJSON('daily', null);
  const today = todayStr();
  if(stored && stored.date===today){ dailyChallenge = stored; }
  else { dailyChallenge = { date:today, topicId:pickDailyTopic(), correctToday:0, target:10, claimed:false }; }
  await saveDaily();
}
async function saveDaily(){ await Store.setJSON('daily', dailyChallenge); }
function loadSettingsSync(){
  try{
    const v = localStorage.getItem('mathquest:settings');
    if(v) settings = Object.assign(settings, JSON.parse(v));
  }catch(e){}
}
function saveSettings(){
  try{ localStorage.setItem('mathquest:settings', JSON.stringify(settings)); }catch(e){}
}
function speak(text){
  if(!settings.readAloud) return;
  if(!('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    const clean = String(text).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
    if(!clean) return;
    const u = new SpeechSynthesisUtterance(clean);
    u.rate = 0.85; u.pitch = 1;
    window.speechSynthesis.speak(u);
  }catch(e){ console.warn('speech failed', e); }
}
let lastSpokenText = '';
function speakAndRemember(text){ lastSpokenText = text; speak(text); }
function replaySpeech(){ if(lastSpokenText) speak(lastSpokenText); }

/* ======================= STORAGE ======================= */
const STORAGE_PREFIX = 'mathquest:';
const Store = {
  async getJSON(key, fallback){
    try{
      const v = localStorage.getItem(STORAGE_PREFIX+key);
      return v ? JSON.parse(v) : fallback;
    }catch(e){ return fallback; }
  },
  async setJSON(key, val){
    try{ localStorage.setItem(STORAGE_PREFIX+key, JSON.stringify(val)); }
    catch(e){ console.error('storage set failed', e); }
  }
};

/* ======================= SHARED FOLDER SYNC (File System Access API) ======================= */
let folderHandle = null;
let folderConnected = false;
const FS_SUPPORTED = typeof window.showDirectoryPicker === 'function';

function idbOpen(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open('mathquest-fs', 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore('handles'); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function idbSaveHandle(handle){
  try{
    const db = await idbOpen();
    await new Promise((res,rej)=>{
      const tx = db.transaction('handles','readwrite');
      tx.objectStore('handles').put(handle, 'mathQuestFolder');
      tx.oncomplete = res; tx.onerror = ()=>rej(tx.error);
    });
  }catch(e){ console.warn('Could not save folder handle', e); }
}
async function idbLoadHandle(){
  try{
    const db = await idbOpen();
    return await new Promise((res,rej)=>{
      const tx = db.transaction('handles','readonly');
      const r = tx.objectStore('handles').get('mathQuestFolder');
      r.onsuccess = ()=>res(r.result||null);
      r.onerror = ()=>rej(r.error);
    });
  }catch(e){ return null; }
}
async function chooseFolder(){
  if(!FS_SUPPORTED){ alert('Your browser doesn\'t support saving to a folder. Please use Chrome or Edge on a computer.'); return; }
  try{
    const handle = await window.showDirectoryPicker({ mode:'readwrite' });
    const perm = await handle.requestPermission({ mode:'readwrite' });
    if(perm==='granted'){
      folderHandle = handle;
      folderConnected = true;
      await idbSaveHandle(handle);
    }
  }catch(e){ console.warn('Folder pick cancelled or failed', e); }
  updateFolderStatusUI();
}
async function tryRestoreFolder(){
  if(!FS_SUPPORTED) return;
  try{
    const handle = await idbLoadHandle();
    if(handle){
      const perm = await handle.queryPermission({ mode:'readwrite' });
      if(perm==='granted'){ folderHandle = handle; folderConnected = true; }
      else { folderHandle = handle; folderConnected = false; } // needs a click to re-grant
    }
  }catch(e){ /* no stored handle yet */ }
  updateFolderStatusUI();
}
async function reconnectFolder(){
  if(!folderHandle){ return chooseFolder(); }
  try{
    const perm = await folderHandle.requestPermission({ mode:'readwrite' });
    if(perm==='granted'){ folderConnected = true; }
  }catch(e){ console.warn('Reconnect failed', e); }
  updateFolderStatusUI();
}
function updateFolderStatusUI(){
  const el = document.getElementById('googleStatus');
  if(el) el.textContent = folderConnected ? '🟢 Shared folder connected' : (folderHandle ? '🟡 Tap to reconnect folder' : '⚪ Folder not connected');
  const btn = document.getElementById('btnConnectGoogle');
  if(btn){
    btn.style.display = folderConnected ? 'none' : 'block';
    btn.textContent = folderHandle ? '🔗 Reconnect Folder' : '📁 Choose MathQuest Folder';
    btn.onclick = folderHandle ? reconnectFolder : chooseFolder;
  }
}

const CSV_FILENAME = 'MathQuest_Progress_Log.csv';
const CSV_HEADER = ['Date','Duration_Min','XP_Earned','Coins_Earned','Correct','Wrong','Accuracy_Pct','Retried_Pct','FirstTry_Pct','Best_Streak','Total_XP','Level','Counting_Min','NumberSense_Min','AddSub_Min','Mult_Min','Div_Min','Frac_Min','MultiDigit_Min','Dec_Min','Money_Min','Word_Min','Topic_Tiers'].join(',');

function buildCsvRow(s){
  const lvlNow = levelOf(profile.xp);
  const totalProblems = s.correctCount;
  const firstTry = Math.max(0, totalProblems - s.retriedCount);
  const firstPct = totalProblems>0 ? Math.round(100*firstTry/totalProblems) : 0;
  const retriedPct = totalProblems>0 ? Math.round(100*s.retriedCount/totalProblems) : 0;
  const totalSubmissions = s.correctCount + s.wrongCount;
  const accPct = totalSubmissions>0 ? Math.round(100*s.correctCount/totalSubmissions) : 0;
  const durationMin = Math.round((Date.now()-s.startTime)/60000);
  const dateStr = new Date().toISOString().slice(0,19).replace('T',' ');
  const topicMin = id => Math.round(((s.topicsTime[id]||0)/60)*10)/10;
  const tiersSnapshot = TOPICS.map(t=>`${t.id}:${topicProgress[t.id].tier}`).join(';');
  return [
    dateStr, durationMin, s.xpEarned, s.coinsEarned, s.correctCount, s.wrongCount,
    accPct, retriedPct, firstPct, s.bestStreak, profile.xp, lvlNow,
    topicMin('counting'), topicMin('numbersense'),
    topicMin('addsub'), topicMin('mult'), topicMin('div'), topicMin('frac'),
    topicMin('multidigit'), topicMin('dec'), topicMin('money'), topicMin('word'),
    tiersSnapshot,
  ].join(',');
}
async function saveDailySummary(s){
  if(!folderConnected || !folderHandle){ return {success:false, error:'Shared folder not connected.'}; }
  try{
    const fileHandle = await folderHandle.getFileHandle(CSV_FILENAME, { create:true });
    let existing = '';
    try{ const file = await fileHandle.getFile(); existing = await file.text(); }catch(e){ /* new file */ }
    const isNew = !existing || existing.trim().length===0;
    const row = buildCsvRow(s);
    const content = isNew ? (CSV_HEADER + '\n' + row + '\n') : (existing.replace(/\s*$/,'') + '\n' + row + '\n');
    const writable = await fileHandle.createWritable();
    await writable.write(content);
    await writable.close();
    return {success:true, filename:CSV_FILENAME};
  }catch(e){
    console.error('CSV log save failed', e);
    return {success:false, error:e.message};
  }
}

function levelOf(xp){ return Math.floor(xp/100)+1; }
function xpIntoLevel(xp){ return xp%100; }

/* ======================= SESSION STATE ======================= */
let session = null;
function newSession(){
  return {
    startTime: Date.now(),
    xpEarned:0, coinsEarned:0,
    correctCount:0, wrongCount:0,
    bestStreak:0, currentStreak:0, retriedCount:0,
    topicsTime:{}, currentTopicId:null, currentTopicStart:null,
  };
}
function switchSessionTopic(newTopicId){
  const now = Date.now();
  if(session.currentTopicId){
    const elapsed = (now - session.currentTopicStart)/1000;
    session.topicsTime[session.currentTopicId] = (session.topicsTime[session.currentTopicId]||0) + elapsed;
    topicProgress[session.currentTopicId].timeSec += elapsed;
    saveTopic(session.currentTopicId);
    profile.totalTimeSec += elapsed;
  }
  session.currentTopicId = newTopicId;
  session.currentTopicStart = now;
}
function endSessionTiming(){
  if(session && session.currentTopicId){
    switchSessionTopic(null);
    session.currentTopicId = null;
  }
}

      return {visualHTML:`<div class="bignum">💰 $${a} − $${b}</div>`, promptText:`You have $${a}. You spend $${b}. How much left?`, answer:a-b, hint:`Subtract what you spent.`, steps:[`Start with $${a}.`,`Spend $${b}.`,`$${a} − $${b} = $${a-b}`]}; },
    ()=>{ const n=randInt(2,hard?9:6), each=pick([2,3,4]);
      return {visualHTML:`<div class="bignum">🐶 ${n} <span class="opchip">×</span> ${each}</div>`, promptText:`${n} dogs get ${each} treats each. How many treats total?`, answer:n*each, hint:`${n} groups of ${each}.`, steps:[`${n} groups of ${each}.`,`${n} × ${each} = ${n*each}`]}; },
  ];
  const hardTemplates = [
    ()=>{ const price=randInt(4,12), n=randInt(2,5), discount=randInt(2,10);
      const answer=price*n-discount;
      return {visualHTML:`<div class="bignum">${n} × $${price} − $${discount}</div>`, promptText:`Tickets cost $${price} each. You buy ${n} and use a $${discount} coupon. Total?`, answer, hint:`Multiply first, then subtract the coupon.`, steps:[`${n} × $${price} = $${price*n}`,`$${price*n} − $${discount} = $${answer}`]}; },
    ()=>{ const start=randInt(30,80), n=randInt(2,6), price=randInt(2,8);
      const answer=start-n*price;
      return {visualHTML:`<div class="bignum">$${start} − (${n} × $${price})</div>`, promptText:`You have $${start}. You buy ${n} snacks at $${price} each. Money left?`, answer, hint:`Multiply first, then subtract from what you started with.`, steps:[`${n} × $${price} = $${n*price}`,`$${start} − $${n*price} = $${answer}`]}; },
    ()=>{ const boxes=randInt(3,8), perBox=randInt(6,12);
      const answer=boxes*perBox;
      return {visualHTML:`<div class="bignum">${boxes} × ${perBox}</div>`, promptText:`${boxes} boxes have ${perBox} pencils each. Total pencils?`, answer, hint:`Groups of ${perBox}, ${boxes} times.`, steps:[`${boxes} × ${perBox} = ${answer}`]}; },
  ];
  const pool = veryHard ? templates.concat(hardTemplates) : templates;
  const p = pick(pool)();
  return {visualHTML:p.visualHTML, promptText:p.promptText, answer:p.answer, hint:p.hint, steps:p.steps, inputType:'keypad', decimal:false};
}
function genSpeedZone(tier){
  return Math.random()<0.5 ? genMult(tier) : genMultiDigit(tier);
}
function genSponsorMoney(tier){
  return Math.random()<0.6 ? genMoney(tier) : genDecimal(tier);
}

function starString(tier){
  return '⭐'.repeat(tier) + '☆'.repeat(12-tier);
}

function recommendedTopicId(){
  let best=null, bestScore=-1;
  for(const t of TOPICS){
    if(!isTopicUnlocked(t.id)) continue;
    const p = topicProgress[t.id];
    const score = (p.lastPlayed? (Date.now()-p.lastPlayed) : Infinity);
    if(score>bestScore || best===null){ bestScore=score; best=t.id; }
  }
  return best;
}

function renderPlay(msg, mood){
  const topic = TOPIC_MAP[currentTopicId];
  const face = mood || 'idle';
  const faceEmoji = {idle:'🏎️', happy:'🏆', encourage:'🔧', think:'🤔', teach:'📘'}[face];
  const bubbleText = msg || coachLine('idle');

  let inputArea = '';
  if(currentProblem.inputType==='choice'){
    inputArea = `<div class="choicegrid">
      ${currentProblem.choices.map(c=>`<button class="btn btn-magenta choiceBtn" data-val="${c}">${c}</button>`).join('')}
    </div>`;
  } else {
    const keys = ['1','2','3','4','5','6','7','8','9', currentProblem.decimal?'.':'', '0','⌫'];
    inputArea = `
      <div class="answerbox" id="answerbox">${answerBuffer || '&nbsp;'}</div>
      <div class="keypad">
        ${keys.map(k=>k===''?'<div></div>':`<button class="key keyBtn" data-k="${k}">${k}</button>`).join('')}
      </div>
      <button class="btn btn-primary btn-block" id="btnSubmit" style="margin-top:12px;">✅ Submit</button>
    `;
  }

  app.innerHTML = `
    ${hud()}
    <div class="card">
      <div class="topbar">
        <button class="linkbtn" id="btnQuit">← Missions</button>
        <span class="small">${topic.emoji} ${topic.name} · Tier ${topicProgress[currentTopicId].tier}/12</span>
      </div>
      <div class="mascot${settings.extraSupport?'':' pop'}">${faceEmoji}</div>
      <div class="bubble">${bubbleText} <button class="linkbtn" id="btnReplay" title="Read aloud again" style="font-size:16px;">🔊</button></div>
      <div class="problembox">
        ${currentProblem.visualHTML}
        <div class="promptline">${currentProblem.promptText}</div>
      </div>
      <div class="feedback" id="feedback"></div>
      ${inputArea}
      <div class="rowbtns" style="margin-top:12px;">
        <button class="btn btn-ghost" id="btnHint">💡 Hint</button>
      </div>
    </div>
  `;
  document.getElementById('btnQuit').onclick = ()=>renderTopics();
  document.getElementById('btnHint').onclick = onHint;
  document.getElementById('btnReplay').onclick = replaySpeech;
  if(currentProblem.inputType==='choice'){
    document.querySelectorAll('.choiceBtn').forEach(b=>b.onclick=()=>submitAnswer(b.dataset.val));
  } else {
    document.querySelectorAll('.keyBtn').forEach(b=>b.onclick=()=>onKey(b.dataset.k));
    document.getElementById('btnSubmit').onclick = ()=>submitAnswer(answerBuffer);
  }
  speakAndRemember(bubbleText + '. ' + currentProblem.promptText);

function onKey(k){
  if(k==='⌫'){ answerBuffer = answerBuffer.slice(0,-1); }
  else if(k==='.'){ if(!answerBuffer.includes('.')) answerBuffer += '.'; }
  else { if(answerBuffer.length<6) answerBuffer += k; }
  const box = document.getElementById('answerbox');
  if(box) box.innerHTML = answerBuffer || '&nbsp;';
}

function onHint(){
  hintUsedThisProblem = true;
  renderPlay(`💡 ${currentProblem.hint}`, 'think');
  // restore buffer visually since renderPlay resets DOM but not answerBuffer variable
  const box = document.getElementById('answerbox');
  if(box) box.innerHTML = answerBuffer || '&nbsp;';
}

function checkAnswer(input){
  if(currentProblem.inputType==='choice') return input===currentProblem.answer;
  const num = parseFloat(input);
  if(isNaN(num)) return false;
  return Math.abs(num - currentProblem.answer) < 0.005;
}

let answerLocked = false;
function submitAnswer(input){
  if(answerLocked) return;
  if(input===''||input===undefined) return;
  answerLocked = true;
  const correct = checkAnswer(input);
  const tp = topicProgress[currentTopicId];

  if(correct){
    session.correctCount++;
    session.currentStreak++;
    session.bestStreak = Math.max(session.bestStreak, session.currentStreak);
    profile.streakBest = Math.max(profile.streakBest, session.currentStreak);

    let xpGain = hintUsedThisProblem ? 5 : 10;
    if(wrongAttemptsThisProblem>=2) xpGain = 5;
    let bonus = 0;
    let bonusMsg = '';
    if(session.currentStreak>0 && session.currentStreak%3===0){
      bonus = 20;
      bonusMsg = settings.extraSupport
        ? `You got ${session.currentStreak} correct in a row! Bonus: +20 XP.`
        : '🔥 ON FIRE — streak bonus +20 XP!';
    }
    const totalGain = xpGain + bonus;
    const oldLevel = levelOf(profile.xp);
    profile.xp += totalGain;
    session.xpEarned += totalGain;
    const newLevel = levelOf(profile.xp);

    const coinGain = session.currentStreak>=5 ? 3 : 1;
    profile.coins += coinGain;
    session.coinsEarned += coinGain;

    tp.correct++; tp.attempts++; tp.streakAtTier++; tp.missAtTier=0;
    let tierUp = false;
    if(tp.streakAtTier>=4 && tp.tier<12){ tp.tier++; tp.streakAtTier=0; tierUp=true; }
    saveTopic(currentTopicId);

    let dailyMsg = '';
    if(dailyChallenge && !dailyChallenge.claimed && currentTopicId===dailyChallenge.topicId){
      dailyChallenge.correctToday++;
      if(dailyChallenge.correctToday>=dailyChallenge.target){
        dailyChallenge.claimed = true;
        profile.xp += 100;
        profile.coins += 20;
        dailyMsg = ' 🎯 Daily Challenge complete! +100 XP, +20 coins!';
      }
      saveDaily();
    }
    saveProfile();

    const msg = bonusMsg || coachLine('correct');
    renderPlay(msg, 'happy');
    document.getElementById('feedback').className='feedback good';
    document.getElementById('feedback').textContent = `+${totalGain} XP  🪙+${coinGain}` + (tierUp? '  ⭐ Tier up!' : '') + dailyMsg;

    if(newLevel>oldLevel){
      setTimeout(()=>showLevelUp(newLevel), 700);
      return;
    }
    if(session.correctCount % 5 === 0){
      setTimeout(showBreakPrompt, 900);
      return;
    }
    setTimeout(nextProblem, 1100);
  } else {
    session.wrongCount++;
    session.currentStreak = 0;
    wrongAttemptsThisProblem++;
    tp.attempts++; tp.streakAtTier=0; tp.missAtTier++;
    let tierDown=false;
    if(tp.missAtTier>=3 && tp.tier>1){ tp.tier--; tp.missAtTier=0; tierDown=true; }
    saveTopic(currentTopicId);

    answerBuffer='';
    if(wrongAttemptsThisProblem>=2){
      session.retriedCount++;
      showWalkthrough();
    } else {
      renderPlay(coachLine('wrong1'), 'encourage');
      document.getElementById('feedback').className='feedback bad';
      document.getElementById('feedback').textContent = 'Give it another shot — no rush.';
      if(!settings.extraSupport){
        const card = document.querySelector('.card');
        card.classList.add('shake');
        setTimeout(()=>card.classList.remove('shake'),350);
      }
      answerLocked = false;
    }
  }
}

let lastFinishedSession = null;
async function finalizeSessionAndGoHome(){
  if(!session){ renderStart(); return; }
  endSessionTiming();
  await saveProfile();
  const durationSec = Math.round((Date.now()-session.startTime)/1000);
  sessions.push({
    date: Date.now(),
    durationSec,
    xpEarned: session.xpEarned,
    coinsEarned: session.coinsEarned,
    correctCount: session.correctCount,
    wrongCount: session.wrongCount,
    bestStreak: session.bestStreak,
    topicsTime: session.topicsTime,
  });
  await saveSessions();
  lastFinishedSession = session;
  renderSessionEnd(session);
  session = null;
}

async function recordSessionData(){
  const s = lastFinishedSession;
  if(!s) return;
  const statusEl = document.getElementById('recordStatus');
  const btn = document.getElementById('btnRecord');
  if(!folderConnected){
    if(!folderHandle){ await chooseFolder(); } else { await reconnectFolder(); }
    if(!folderConnected){
      if(statusEl) statusEl.textContent = '⚪ Folder not connected. Tap "Record Data" again after choosing the folder.';
      return;
    }
  }
  if(btn){ btn.disabled = true; btn.textContent = 'Saving...'; }
  const result = await saveDailySummary(s);
  if(result.success){
    if(statusEl) statusEl.textContent = `✅ Saved to ${result.filename}`;
    if(btn){ btn.textContent = '✅ Recorded'; }
  } else {
    if(statusEl) statusEl.textContent = `❌ Failed: ${result.error}`;
    if(btn){ btn.textContent = '📝 Record Data'; btn.disabled = false; }
  }
}

function renderSessionEnd(s){
  const mins = Math.round((Date.now()-s.startTime)/60000);
  app.innerHTML = `
    ${hud()}
    <div class="card center">
      <div class="mascot"><img src="${ARAN_AVATAR}" alt="Aran"></div>
      <h1 class="title" style="font-size:30px;">Great Session!</h1>
      <div class="statgrid">
        <div class="statcard"><div class="n">+${s.xpEarned}</div><div class="l">XP earned</div></div>
        <div class="statcard"><div class="n">Lv${levelOf(profile.xp)}</div><div class="l">Level now</div></div>
        <div class="statcard"><div class="n">🪙 ${profile.coins}</div><div class="l">Total coins</div></div>
        <div class="statcard"><div class="n">🔥 ${s.bestStreak}</div><div class="l">Best streak</div></div>
      </div>
      <p class="small">${s.correctCount} correct · ${mins} min played</p>
      <button class="btn btn-yellow btn-block" id="btnRecord" style="margin-top:14px;">📝 Record Data</button>
      <p class="small" id="recordStatus" style="margin-top:6px;">Tap to save this session for Dad.</p>
      <button class="btn btn-primary btn-block" id="btnAgain" style="margin-top:10px;">Play Again</button>
      <div style="margin-top:12px;"><button class="linkbtn" id="btnDone">Done</button></div>
    </div>
  `;
  document.getElementById('btnRecord').onclick = recordSessionData;
  document.getElementById('btnAgain').onclick = ()=>{ session=newSession(); renderTopics(); };
  document.getElementById('btnDone').onclick = renderStart;
}

/* ======================= DASHBOARD (parent view) ======================= */
function isoWeek(ts){
  const d = new Date(ts);
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() + 3 - ((d.getDay()+6)%7));
  const week1 = new Date(d.getFullYear(),0,4);
  return d.getFullYear()+'-W'+(1+Math.round(((d-week1)/86400000 - 3 + ((week1.getDay()+6)%7))/7));
}
function showReportModal(text){
  const overlay = document.createElement('div');
  overlay.className='modal-bg';
  overlay.innerHTML = `
    <div class="modal">
      <h2 class="display" style="font-size:20px;margin-top:0;">📋 Progress Report</h2>
      <textarea id="reportText" readonly style="width:100%;height:220px;border-radius:12px;padding:10px;font-family:monospace;font-size:12px;background:var(--panel-2);color:var(--text);border:2px solid #ffffff20;resize:vertical;">${text}</textarea>
      <div class="rowbtns" style="margin-top:10px;">
        <button class="btn btn-primary" id="btnCopyNow">📋 Copy to Clipboard</button>
        <button class="btn btn-ghost" id="btnReportDone">Done</button>
      </div>
      <p class="small" id="copyStatus" style="margin-top:6px;"></p>
    </div>
  `;
  document.body.appendChild(overlay);
  const ta = document.getElementById('reportText');
  ta.focus(); ta.select();
  document.getElementById('btnCopyNow').onclick = async ()=>{
    const statusEl = document.getElementById('copyStatus');
    try{
      await navigator.clipboard.writeText(text);
      statusEl.textContent = '✅ Copied! Paste it into a text or email.';
    }catch(e){
      ta.focus(); ta.select();
      try{
        document.execCommand('copy');
        statusEl.textContent = '✅ Copied! Paste it into a text or email.';
      }catch(e2){
        statusEl.textContent = 'Could not auto-copy — the text above is selected, use Ctrl+C (or long-press → Copy) to copy it manually.';
      }
    }
  };
  document.getElementById('btnReportDone').onclick = ()=>overlay.remove();
}
function buildReportText(){
  const totalTimeMin = Math.round(profile.totalTimeSec/60);
  const lines = [];
  lines.push(`Math Quest Progress Report — ${new Date().toLocaleDateString()}`);
  lines.push(`Level ${levelOf(profile.xp)} · ${profile.xp} lifetime XP · Best streak ${profile.streakBest}`);
  lines.push(`Total time played: ${totalTimeMin} min`);
  lines.push('');
  lines.push('By topic:');
  TOPICS.forEach(t=>{
    const p = topicProgress[t.id];
    const unlocked = isTopicUnlocked(t.id);
    if(!unlocked && p.timeSec<1){
      lines.push(`- ${t.name}: 🔒 not unlocked yet`);
      return;
    }
    const mins = Math.round(p.timeSec/60);
    const acc = p.attempts>0 ? Math.round(100*p.correct/p.attempts) : 0;
    lines.push(`- ${t.name}: Tier ${p.tier}/12, ${mins} min played, ${acc}% accuracy`);
  });
  lines.push('');
  lines.push('Last 5 sessions:');
  const recent = sessions.slice().reverse().slice(0,5);
  if(recent.length===0){ lines.push('- No sessions yet.'); }
  recent.forEach(s=>{
    const d = new Date(s.date).toLocaleDateString();
    const acc = (s.correctCount+s.wrongCount)>0 ? Math.round(100*s.correctCount/(s.correctCount+s.wrongCount)) : 0;
    lines.push(`- ${d}: ${Math.round(s.durationSec/60)} min, +${s.xpEarned} XP, ${acc}% accuracy`);
  });
  return lines.join('\n');
}
function renderDashboard(){
  const totalTimeMin = Math.round(profile.totalTimeSec/60);
  const maxTopicTime = Math.max(1,...TOPICS.map(t=>topicProgress[t.id].timeSec));
  const weekly = {};
  sessions.forEach(s=>{
    const wk = isoWeek(s.date);
    weekly[wk] = (weekly[wk]||0) + s.xpEarned;
  });
  const weeks = Object.keys(weekly).sort().slice(-6);
  const maxWeekXp = Math.max(1,...weeks.map(w=>weekly[w]));

  app.innerHTML = `
    <div class="card">
      <div class="topbar">
        <button class="linkbtn" id="btnBack">← Back</button>
        <span class="small">Parent Dashboard</span>
      </div>
      <h2 class="display" style="margin-top:4px;">📊 Progress</h2>
      <div class="statgrid">
        <div class="statcard"><div class="n">${totalTimeMin}m</div><div class="l">total time played</div></div>
        <div class="statcard"><div class="n">Lv${levelOf(profile.xp)}</div><div class="l">current level</div></div>
        <div class="statcard"><div class="n">${profile.xp}</div><div class="l">lifetime XP</div></div>
        <div class="statcard"><div class="n">🔥 ${profile.streakBest}</div><div class="l">best streak ever</div></div>
      </div>

      <h3 class="display" style="font-size:17px;">Time by topic</h3>
      ${TOPICS.map(t=>{
        const p = topicProgress[t.id];
        const pct = Math.round((p.timeSec/maxTopicTime)*100);
        const mins = Math.round(p.timeSec/60);
        const acc = p.attempts>0 ? Math.round(100*p.correct/p.attempts) : 0;
        return `<div class="dashrow">
          <span class="small" style="width:120px;">${t.emoji} ${t.name}</span>
          <div class="dashbar-track"><div class="dashbar-fill" style="width:${pct}%"></div></div>
          <span class="small" style="width:110px;text-align:right;">${mins}m · T${p.tier} · ${acc}%</span>
        </div>`;
      }).join('')}

      <h3 class="display" style="font-size:17px;margin-top:16px;">Weekly XP trend</h3>
      ${weeks.length===0 ? `<p class="small">No sessions yet.</p>` : `
      <div style="display:flex;align-items:flex-end;gap:8px;height:80px;margin-bottom:6px;">
        ${weeks.map(w=>{
          const h = Math.max(6, Math.round((weekly[w]/maxWeekXp)*70));
          return `<div style="flex:1;text-align:center;">
            <div style="background:var(--green);height:${h}px;border-radius:4px 4px 0 0;"></div>
            <div class="small" style="font-size:10px;">${w.split('-W')[1]}</div>
          </div>`;
        }).join('')}
      </div>`}

      <h3 class="display" style="font-size:17px;margin-top:16px;">Recent sessions</h3>
      <div class="sesslist">
        ${sessions.slice().reverse().slice(0,15).map(s=>{
          const d = new Date(s.date);
          const dstr = d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
          const acc = (s.correctCount+s.wrongCount)>0 ? Math.round(100*s.correctCount/(s.correctCount+s.wrongCount)) : 0;
          return `<div class="sessrow"><span>${dstr}</span><span>${Math.round(s.durationSec/60)}m</span><span>+${s.xpEarned}XP</span><span>${acc}% acc</span></div>`;
        }).join('') || '<p class="small">No sessions yet — have him play a round!</p>'}
      </div>

      <p class="small" style="margin-top:14px;" id="googleStatusDash">${folderConnected ? '🟢 Shared folder connected' : '⚪ Folder not connected'}</p>
      <button class="btn btn-yellow btn-block" id="btnCheckFolder">📁 Check / Reconnect Folder</button>
      <button class="btn btn-primary btn-block" id="btnCopyReport" style="margin-top:10px;">📋 Copy Report to Share</button>
      <button class="btn btn-magenta btn-block" id="btnNewSeason" style="margin-top:18px;">🏁 Start a New Season</button>
      <button class="btn btn-yellow btn-block" id="btnRecalibrate" style="margin-top:10px;">🔄 Recalibrate Difficulty</button>
      <button class="btn btn-ghost btn-block" id="btnReset" style="margin-top:10px;">Reset all progress</button>
    </div>
  `;
  document.getElementById('btnBack').onclick = renderStart;
  document.getElementById('btnCheckFolder').onclick = async ()=>{
    if(!folderHandle){ await chooseFolder(); } else { await reconnectFolder(); }
    const el = document.getElementById('googleStatusDash');
    if(el) el.textContent = folderConnected ? '🟢 Shared folder connected' : '⚪ Still not connected — try again';
    if(folderConnected) alert('✅ Connected! No data was written — this button only checks the connection.');
  };
  document.getElementById('btnCopyReport').onclick = ()=>{
    showReportModal(buildReportText());
  };
  document.getElementById('btnNewSeason').onclick = async ()=>{
    if(confirm(`Start Season ${profile.seasons+2}? This resets his Level back to 1 and every topic's difficulty back to the start, so leveling up feels exciting again. He KEEPS all his coins, his car paint job, and a permanent "Season" trophy for what he's already accomplished. His play history stays too.`)){
      profile.xp = 0;
      profile.seasons += 1;
      for(const t of TOPICS){
        topicProgress[t.id].tier = 1;
        topicProgress[t.id].streakAtTier = 0;
        topicProgress[t.id].missAtTier = 0;
        await saveTopic(t.id);
      }
      await saveProfile();
      alert(`🏆 Season ${profile.seasons+1} begins! Fresh climb, same coins and paint job.`);
      renderDashboard();
    }
  };
  document.getElementById('btnRecalibrate').onclick = async ()=>{
    if(confirm("Reset difficulty back to the easiest level in every topic? His XP, coins, and level stay the same — only the difficulty tiers reset, so he starts fresh from the basics and re-earns his way up.")){
      for(const t of TOPICS){
        topicProgress[t.id].tier = 1;
        topicProgress[t.id].streakAtTier = 0;
        topicProgress[t.id].missAtTier = 0;
        await saveTopic(t.id);
      }
      alert('Done! Every topic is back to the easiest tier — his XP and coins are untouched.');
      renderDashboard();
    }
  };
  document.getElementById('btnReset').onclick = async ()=>{
    if(confirm('Reset all XP, coins, and topic progress? This cannot be undone.')){
      profile = defaultProfile();
      for(const t of TOPICS) topicProgress[t.id] = defaultTopicProgress();
      sessions = [];
      await saveProfile();
      for(const t of TOPICS) await saveTopic(t.id);
      await saveSessions();
      renderDashboard();
    }
  };
}

  loadSettingsSync();
  app.innerHTML = `<div class="card center"><div class="mascot"><img src="${ARAN_AVATAR}" alt="Aran"></div><p class="small">Loading your quest...</p></div>`;
  await loadAll();
  applyPaintColor();
  await loadDaily();
  renderStart();
  await tryRestoreFolder();
})();
</script>
