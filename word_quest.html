<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Word Quest — Reading & Listening Coach</title>
<style>
  :root{
    --bg:#EEF3F1;
    --surface:#FFFFFF;
    --ink:#1F2A28;
    --muted:#5B6B67;
    --accent:#3A7D7B;
    --accent-dark:#2A5B59;
    --accent-light:#DCEBE9;
    --gold:#E0A83E;
    --gold-light:#FBF0DA;
    --good:#4C9A6A;
    --good-light:#E6F3EA;
    --soft:#C97B63;
    --soft-light:#F7E9E3;
    --border:#DEE7E4;
    --radius-lg:20px;
    --radius-md:14px;
    --shadow:0 2px 14px rgba(31,42,40,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app-shell{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
  }
  /* ---------- status bar ---------- */
  header.status-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:12px 16px;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:5;
  }
  .stat{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:0.92rem;
    color:var(--muted);
    font-weight:600;
    white-space:nowrap;
  }
  .stat b{color:var(--ink); font-variant-numeric:tabular-nums;}
  .level-pill{
    background:var(--accent);
    color:#fff;
    border-radius:999px;
    padding:4px 12px;
    font-weight:700;
    font-size:0.9rem;
  }
  .icon-btn{
    border:none;
    background:var(--accent-light);
    color:var(--accent-dark);
    width:38px;height:38px;
    border-radius:12px;
    font-size:1.05rem;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .icon-btn:focus-visible{outline:3px solid var(--accent); outline-offset:2px;}

  main{
    flex:1;
    padding:20px 18px 32px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }

  h1,h2,h3{margin:0;}
  .headline{font-size:1.5rem; line-height:1.3; font-weight:800; letter-spacing:-0.01em;}
  .subline{color:var(--muted); font-size:1.02rem; line-height:1.5;}

  .card{
    background:var(--surface);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow);
    padding:22px;
  }

  .big-btn{
    display:block;
    width:100%;
    padding:16px 20px;
    border-radius:var(--radius-md);
    border:none;
    background:var(--accent);
    color:#fff;
    font-size:1.08rem;
    font-weight:700;
    cursor:pointer;
    text-align:center;
  }
  .big-btn.secondary{
    background:var(--accent-light);
    color:var(--accent-dark);
  }
  .big-btn.ghost{
    background:transparent;
    color:var(--accent-dark);
    border:2px solid var(--accent-light);
  }
  .big-btn:focus-visible, .choice-btn:focus-visible{outline:3px solid var(--accent-dark); outline-offset:2px;}
  .btn-row{display:flex; gap:12px;}
  .btn-row .big-btn{flex:1;}

  /* ---------- skill map ---------- */
  .skill-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .skill-card{
    background:var(--surface);
    border-radius:var(--radius-md);
    padding:16px 14px;
    box-shadow:var(--shadow);
    text-align:left;
    border:2px solid transparent;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    gap:6px;
    min-height:132px;
  }
  .skill-card .emoji{font-size:1.8rem;}
  .skill-card .name{font-weight:700; font-size:0.98rem; line-height:1.25;}
  .skill-card .tag{
    font-size:0.78rem;
    font-weight:700;
    color:var(--accent-dark);
    background:var(--accent-light);
    border-radius:999px;
    padding:2px 8px;
    align-self:flex-start;
  }
  .skill-card.mastered{border-color:var(--good);}
  .skill-card.mastered .tag{background:var(--good-light); color:var(--good);}
  .skill-card.locked{opacity:0.5; cursor:not-allowed;}
  .skill-card.current{border-color:var(--accent);}

  /* ---------- session stage ---------- */
  .prompt-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
  }
  .prompt-text{
    font-size:1.22rem;
    font-weight:700;
    line-height:1.4;
    flex:1;
  }
  .replay-btn{
    flex-shrink:0;
    width:44px;height:44px;
    border-radius:12px;
    border:none;
    background:var(--accent-light);
    color:var(--accent-dark);
    font-size:1.2rem;
    cursor:pointer;
  }
  .big-emoji{font-size:5rem; text-align:center; padding:10px 0;}
  .pair-emoji{display:flex; justify-content:center; gap:34px; font-size:3.6rem; padding:8px 0;}
  .scene{font-size:1.6rem; text-align:center; padding:12px 0; line-height:1.6;}

  .choices{display:flex; flex-direction:column; gap:10px; margin-top:6px;}
  .choice-btn{
    width:100%;
    text-align:left;
    padding:15px 16px;
    border-radius:var(--radius-md);
    border:2px solid var(--border);
    background:var(--surface);
    font-size:1.08rem;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
    color:var(--ink);
  }
  .choice-btn .em{font-size:1.5rem;}
  .choice-btn:hover{border-color:var(--accent);}
  .choice-btn.correct{background:var(--good-light); border-color:var(--good);}
  .choice-btn.incorrect{background:var(--soft-light); border-color:var(--soft);}
  .choice-btn.done{opacity:0.55; cursor:default;}
  .choice-btn[disabled]{cursor:default;}
  .step-badge{
    background:var(--gold);
    color:#fff;
    font-size:0.75rem;
    font-weight:800;
    border-radius:999px;
    padding:2px 8px;
    margin-left:auto;
  }

  .feedback-banner{
    border-radius:var(--radius-md);
    padding:14px 16px;
    font-weight:700;
    font-size:1.02rem;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .feedback-banner.good{background:var(--good-light); color:var(--good);}
  .feedback-banner.retry{background:var(--soft-light); color:var(--soft);}
  .walkthrough{
    background:var(--gold-light);
    border-radius:var(--radius-md);
    padding:16px;
    font-size:1.02rem;
    line-height:1.5;
  }

  .action-row{display:flex; gap:10px; flex-wrap:wrap;}
  .action-row .big-btn{flex:1; min-width:120px;}

  .xp-track{
    height:10px;
    background:var(--accent-light);
    border-radius:999px;
    overflow:hidden;
  }
  .xp-fill{
    height:100%;
    background:var(--accent);
    border-radius:999px;
  }
  @media (prefers-reduced-motion:no-preference){
    .xp-fill{transition:width 0.5s ease;}
  }

  .settings-panel{display:flex; flex-direction:column; gap:14px;}
  .setting-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--surface);
    border-radius:var(--radius-md);
    padding:14px 16px;
  }
  .setting-row .label{font-weight:700;}
  .setting-row .desc{color:var(--muted); font-size:0.85rem; margin-top:2px;}
  .switch{
    position:relative;
    width:50px;height:28px;
    background:var(--border);
    border-radius:999px;
    border:none;
    cursor:pointer;
    flex-shrink:0;
  }
  .switch.on{background:var(--accent);}
  .switch::after{
    content:"";
    position:absolute;
    top:3px;left:3px;
    width:22px;height:22px;
    background:#fff;
    border-radius:50%;
  }
  .switch.on::after{left:25px;}

  .summary-stat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .summary-stat{
    background:var(--accent-light);
    border-radius:var(--radius-md);
    padding:14px;
    text-align:center;
  }
  .summary-stat .num{font-size:1.5rem; font-weight:800; color:var(--accent-dark);}
  .summary-stat .lbl{font-size:0.8rem; color:var(--muted); font-weight:600;}

  .skill-report-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid var(--border);
    font-size:0.92rem;
  }
  .skill-report-row:last-child{border-bottom:none;}

  .toast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translateX(-50%);
    background:var(--ink);
    color:#fff;
    padding:12px 20px;
    border-radius:999px;
    font-weight:700;
    font-size:0.95rem;
    z-index:20;
    max-width:90%;
    text-align:center;
  }

  .overlay{
    position:fixed;
    inset:0;
    background:rgba(31,42,40,0.45);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    z-index:30;
  }
  .overlay .card{max-width:380px; width:100%;}

  .footnote{color:var(--muted); font-size:0.82rem; line-height:1.5; text-align:center; margin-top:4px;}
  .link-btn{background:none; border:none; color:var(--accent-dark); font-weight:700; text-decoration:underline; cursor:pointer; font-size:0.92rem; padding:0;}
</style>

<div class="app-shell" id="app"></div>

<script>
/* =========================================================
   LOCAL LOGGING — writes progress directly to a folder on this
   device using the File System Access API. Works when this page
   is served over HTTPS (e.g. GitHub Pages) in Chrome or Edge.
   Falls back to nothing automatically in unsupported browsers —
   nothing writes automatically in unsupported browsers.

   Two separate files, each with its own clean schema:
     WordQuest_Progress_Log.csv - one row per answer (matches the
       MathQuest_Progress_Log.csv naming/granularity)
     WordQuest_Session_Log.csv  - one row per skill per session
   ========================================================= */
const supportsFolderLogging = 'showDirectoryPicker' in window;
let logDirHandle = null;
let progressFileHandle = null;
let sessionFileHandle = null;
const PROGRESS_FILE_NAME = 'WordQuest_Progress_Log.csv';
const SESSION_FILE_NAME = 'WordQuest_Session_Log.csv';
const PROGRESS_HEADER = [
  'timestamp','skill','tier','correct','hint_used','wrong_attempts',
  'time_seconds','xp_earned','coin_earned','streak','level'
];
const SESSION_HEADER = [
  'timestamp','duration_minutes','skill','tier','attempts','accuracy_pct',
  'hints_used_total','time_spent_seconds_total','total_xp','total_level','total_coins','best_streak'
];

function csvField(v){
  const s = String(v ?? '');
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function csvRow(header, fields){ return header.map(k => csvField(fields[k])).join(',') + '\n'; }

// Minimal IndexedDB helpers to remember the chosen folder handle between visits
const IDB_NAME = 'word-quest-fs', IDB_STORE = 'handles';
function idbOpen(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSet(key, val){
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(val, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function ensureFileHandles(){
  if(!logDirHandle) return false;
  if(!progressFileHandle) progressFileHandle = await logDirHandle.getFileHandle(PROGRESS_FILE_NAME, {create:true});
  if(!sessionFileHandle) sessionFileHandle = await logDirHandle.getFileHandle(SESSION_FILE_NAME, {create:true});
  return true;
}

async function appendText(fileHandle, text){
  const file = await fileHandle.getFile();
  const writable = await fileHandle.createWritable({keepExistingData:true});
  await writable.write({type:'write', position:file.size, data:text});
  await writable.close();
}

async function appendRows(fileHandle, header, rows){
  const file = await fileHandle.getFile();
  let text = file.size === 0 ? header.join(',') + '\n' : '';
  for(const r of rows) text += csvRow(header, r);
  await appendText(fileHandle, text);
}

async function logEvent(payload){
  if(!logDirHandle) return;
  try{
    if(!(await ensureFileHandles())) return;
    await appendRows(progressFileHandle, PROGRESS_HEADER, [{
      timestamp: new Date().toISOString(),
      skill: payload.skillName,
      tier: payload.tier,
      correct: payload.correct,
      hint_used: payload.hintUsed,
      wrong_attempts: payload.wrongAttemptsOnItem,
      time_seconds: Math.round((payload.timeMs || 0) / 1000),
      xp_earned: payload.xpGain,
      coin_earned: payload.coinGain,
      streak: payload.streak,
      level: payload.level
    }]);
  } catch(e){ console.warn('Word Quest: could not write progress log', e); }
}

async function logSession(summary){
  if(!logDirHandle) return;
  try{
    if(!(await ensureFileHandles())) return;
    const ts = new Date().toISOString();
    const skills = summary.skills && summary.skills.length ? summary.skills : [{}];
    await appendRows(sessionFileHandle, SESSION_HEADER, skills.map(s => ({
      timestamp: ts,
      duration_minutes: summary.durationMinutes,
      skill: s.name || '',
      tier: s.tier ?? '',
      attempts: s.attempts ?? '',
      accuracy_pct: s.accuracy ?? '',
      hints_used_total: s.hintsUsed ?? '',
      time_spent_seconds_total: s.timeSpentSeconds ?? '',
      total_xp: summary.xp,
      total_level: summary.level,
      total_coins: summary.coins,
      best_streak: summary.bestStreak
    })));
  } catch(e){ console.warn('Word Quest: could not write session log', e); }
}

async function chooseLogFolder(){
  if(!supportsFolderLogging) return;
  try{
    const handle = await window.showDirectoryPicker({mode:'readwrite'});
    logDirHandle = handle;
    progressFileHandle = null;
    await idbSet('logDir', handle);
    state.logFolderName = handle.name;
    state.logFolderReady = true;
    state.pendingHandle = null;
    toast(`Saving progress to "${handle.name}"`);
    render();
  } catch(e){
    if(e && e.name !== 'AbortError'){ toast("Couldn't connect that folder."); }
  }
}

async function reconnectLogFolder(){
  if(state.pendingHandle){
    try{
      const perm = await state.pendingHandle.requestPermission({mode:'readwrite'});
      if(perm === 'granted'){
        logDirHandle = state.pendingHandle;
        state.logFolderReady = true;
        toast('Reconnected — saving progress again.');
        render();
        return;
      }
    } catch(e){ /* fall through to re-picking a folder */ }
  }
  chooseLogFolder();
}

async function initLogging(){
  if(!supportsFolderLogging){ render(); return; }
  try{
    const handle = await idbGet('logDir');
    if(handle){
      state.logFolderName = handle.name;
      const perm = await handle.queryPermission({mode:'readwrite'});
      if(perm === 'granted'){
        logDirHandle = handle;
        state.logFolderReady = true;
      } else {
        state.pendingHandle = handle;
        state.logFolderReady = false;
      }
    }
  } catch(e){ /* no folder chosen yet, or permission API unavailable */ }
  render();
}

const SENTENCES = [
  {tier:1, text:'The cat is small.', visual:'🐱', q:'What is small?', correct:'The cat', distractors:['The dog','The bird']},
  {tier:1, text:'The apple is red.', visual:'🍎', q:'What color is the apple?', correct:'Red', distractors:['Blue','Green']},
  {tier:1, text:'The dog is happy.', visual:'🐶 😊', q:'How does the dog feel?', correct:'Happy', distractors:['Sad','Scared']},
  {tier:1, text:'The ball is round.', visual:'⚽', q:'What shape is the ball?', correct:'Round', distractors:['Square','Flat']},
  {tier:2, text:'The cat is under the table.', visual:'🐱 ⬇️ 🪑', q:'Where is the cat?', correct:'Under the table', distractors:['On the table','Next to the chair']},
  {tier:2, text:'The bird is in the tree.', visual:'🐦 ➡️ 🌳', q:'Where is the bird?', correct:'In the tree', distractors:['On the ground','In the water']},

  {tier:2, text:'The fish is in the water.', visual:'🐟 🌊', q:'Where is the fish?', correct:'In the water', distractors:['On the grass','In the sky']},
  {tier:3, text:'The boy is eating a cookie.', visual:'🧒 🍪', q:'What is the boy eating?', correct:'A cookie', distractors:['A banana','An apple']},

/* =========================================================
   HELPERS
   ========================================================= */
function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function sample(arr, n){ return shuffle(arr).slice(0, n); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function speak(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.88;
  u.pitch = 1.0;
  window.speechSynthesis.speak(u);
}

function genFollow(skill){
  const tier = skill.tier;
  if(tier <= 2){
    const n = tier===1?3:4;
    const pool = shuffle(SHAPES.concat(ANIMALS));
    const chosen = sample(pool, n);
    const target = rand(chosen);
    return {
      skillId:1, type:'single',
      promptText:`Point to the ${target.name}.`,
      visual:null,
      displayChoices: shuffle(chosen).map(c => ({key:c.name, label:c.name, emoji:c.emoji})),
      correctKey: target.name,
      hintText:`Look for something that looks like this: ${target.emoji}`,
      explanation:`The ${target.name} looks like ${target.emoji}. That's the one we tap.`
    };
  } else {
    const n = tier===3?4:5;
    const pool = shuffle(ATTRIBUTE_ITEMS.concat(WEATHER, EMOTIONS));
    const chosen = sample(pool, n);
    const target = rand(chosen);
    return {
      skillId:1, type:'single',
      promptText:`Point to the ${target.name}.`,
      visual:null,
      displayChoices: shuffle(chosen).map(c => ({key:c.name, label:c.name, emoji:c.emoji})),
      correctKey: target.name,
      hintText:`Look closely — you're looking for ${target.emoji}`,
      explanation:`"${target.name}" matches ${target.emoji}. The choices look similar, so it takes a careful look.`
    };
  }
}

function genMatch(skill){
  const tier = skill.tier;
  const n = tier===1?3:4;
  let basePool;
  if(tier===1) basePool = SHAPES.concat(ANIMALS, FOOD, VEHICLES);
  else if(tier===2) basePool = ALL_NAMED;
  else basePool = EMOTIONS.concat(PROFESSIONS, SCHOOL_OBJECTS, SPORTS);
  const chosen = sample(basePool, n);
  const target = rand(chosen);
  return {
    skillId:2, type:'single',
    promptText: tier>=3 ? 'Which word matches what this shows?' : 'Which word matches the picture?',
    visual:`<div class="big-emoji">${target.emoji}</div>`,
    displayChoices: shuffle(chosen).map(c => ({key:c.name, label:c.name, emoji:null})),
    correctKey: target.name,
    hintText:`Say it out loud: ${target.name}`,
    explanation:`The picture ${target.emoji} matches the word "${target.name}."`
  };
}

function genCategory(skill){
  const tier = skill.tier;
  const basicGroups = [ANIMALS, VEHICLES, FOOD];
  const extendedGroups = [ANIMALS, VEHICLES, FOOD, EMOTIONS, SCHOOL_OBJECTS, SPORTS, PROFESSIONS, WEATHER];
  if(tier === 1){
    const same = Math.random() < 0.5;
    const g = rand(basicGroups);
    const a = rand(g);
    let b;
    if(same){ b = a; } else { do { b = rand(g); } while(b.name === a.name); }
    return {
      skillId:3, type:'single',
      promptText:'Are these the same, or different?',
      visual:`<div class="pair-emoji"><span>${a.emoji}</span><span>${b.emoji}</span></div>`,
      displayChoices:[{key:'same', label:'Same'}, {key:'different', label:'Different'}],
      correctKey: same ? 'same' : 'different',
      hintText: same ? 'Look closely — they look exactly alike.' : 'Look closely — one part is different.',
      explanation: same ? 'They match! Both pictures are exactly the same.' : 'They are different! Look closely and you can see it.'
    };
  } else {
    const n = tier===2?3:tier===3?4:5;
    const groups = tier===2 ? basicGroups : extendedGroups;
    const mainGroup = rand(groups);
    const others = groups.filter(g => g !== mainGroup);
    const oddGroup = rand(others);
    const mainItems = sample(mainGroup, n-1);
    const oddItem = rand(oddGroup);
    const all = shuffle(mainItems.concat([oddItem]));
    return {
      skillId:3, type:'single',
      promptText:"Which one doesn't belong?",
      visual:null,
      displayChoices: all.map(c => ({key:c.name, label:c.name, emoji:c.emoji})),
      correctKey: oddItem.name,
      hintText:'Most of these belong to the same group. One is a different kind of thing.',
      explanation:`"${oddItem.name}" doesn't belong — the rest are a different kind of thing.`
    };
  }
}

function genTwoStep(skill){
  const tier = skill.tier;
  const steps = tier<=2 ? 2 : 3;
  const n = tier===1?3:tier===2?4:5;
  const pool = tier<=2 ? shuffle(SHAPES.concat(ANIMALS)) : shuffle(SHAPES.concat(ANIMALS, SCHOOL_OBJECTS, SPORTS));
  const chosen = sample(pool, n);
  const targets = sample(chosen, steps);
  const names = targets.map(t => t.name);
  const promptText = steps===2
    ? `Touch the ${names[0]}, then the ${names[1]}.`
    : `Touch the ${names[0]}, then the ${names[1]}, then the ${names[2]}.`;
  return {
    skillId:4, type:'sequence',
    promptText,
    visual:null,
    displayChoices: shuffle(chosen).map(c => ({key:c.name, label:c.name, emoji:c.emoji})),
    targetKeys: names,
    hintText:`First tap the ${names[0]}.`,
    explanation:`In order: ${targets.map((t,i) => `${i+1}) ${t.emoji} ${t.name}`).join(', ')}.`
  };
}

function genSentence(skill){
  const tier = skill.tier;
  const bank = SENTENCES.filter(s => s.tier === tier);
  const item = rand(bank);
  const choices = shuffle([item.correct, ...item.distractors]).map(c => ({key:c, label:c}));
  return {
    skillId:5, type:'single',
    promptText:`${item.text} ${item.q}`,
    visual:`<div class="scene">${item.visual}</div>`,
    displayChoices: choices,
    correctKey: item.correct,
    hintText:`Listen again: ${item.text}`,
    explanation:`The sentence says: "${item.text}" So the answer is "${item.correct}."`
  };
}

function genOrder(skill){
  const tier = skill.tier;
  const bank = tier<=2 ? SEQUENCES_3 : SEQUENCES_4;
  const seq = rand(bank);
  const order = seq.steps.map(s => s.label);
  return {
    skillId:6, type:'sequence',
    promptText: order.length===3
      ? 'Tap the steps in order: first, next, last.'
      : 'Tap the steps in order: first, then, next, last.',
    visual:null,
    displayChoices: shuffle(seq.steps).map(s => ({key:s.label, label:s.label, emoji:s.emoji})),
    targetKeys: order,
    hintText:`Think about what happens first: ${order[0]}.`,
    explanation:`The order is: ${order.map((o,i) => `${i+1}) ${o}`).join(', ')}.`
  };
}

function genSocial(skill){
  const tier = skill.tier;
  const n = tier===1?2:tier===2?3:tier===3?3:4;
  const item = rand(SOCIAL_SCENARIOS);
  const others = shuffle(item.distractors).slice(0, Math.max(0, n-1));
  const chosen = shuffle([item.correct, ...others]);
  return {
    skillId:7, type:'single',
    promptText: item.scenario,
    visual: item.emoji ? `<div class="big-emoji">${item.emoji}</div>` : null,
    displayChoices: chosen.map(c => ({key:c, label:c})),
    correctKey: item.correct,
    hintText:'Think about what sounds kind and clear to say.',
    explanation:`A good thing to say is: "${item.correct}"`
  };
}

function genPassage(skill){
  const tier = skill.tier;
  const bank = PASSAGES.filter(p => p.tier === tier);
  const item = rand(bank.length ? bank : PASSAGES);
  const choices = shuffle([item.correct, ...item.distractors]).map(c => ({key:c, label:c}));
  return {
    skillId:8, type:'single',
    promptText:`${item.text} ${item.q}`,
    visual: item.visual ? `<div class="scene">${item.visual}</div>` : null,
    displayChoices: choices,
    correctKey: item.correct,
    hintText:`Listen again: ${item.text}`,
    explanation:`The passage says: "${item.text}" So the answer is "${item.correct}."`
  };
}

function genBuildSentence(skill){
  const tier = skill.tier;
  const bank = SENTENCE_BUILD.filter(s => tier<=2 ? s.words.length<=5 : true);
  const item = rand(bank.length ? bank : SENTENCE_BUILD);
  const tiles = item.words.map((w,i) => ({key:`${w}__${i}`, label:w}));
  if(tier >= 3){
    const extra = rand(['quickly','yesterday','maybe','loudly','carefully']);
    tiles.push({key:`${extra}__extra`, label:extra});
  }
  const targetKeys = item.words.map((w,i) => `${w}__${i}`);
  return {
    skillId:9, type:'sequence',
    promptText:'Tap the words in order to build the sentence.',
    visual:null,
    displayChoices: shuffle(tiles).map(t => ({key:t.key, label:t.label})),
    targetKeys,
    hintText:`The sentence starts with "${item.words[0]}."`,
    explanation:`The sentence is: "${item.words.join(' ')}."`
  };
}

function genMissions(skill){
  const tier = skill.tier;
  const bank = INSTRUCTION_SETS.filter(s => s.tier === tier);
  const item = rand(bank.length ? bank : INSTRUCTION_SETS);
  const order = item.steps.map(s => s.label);
  return {
    skillId:10, type:'sequence',
    promptText:`${item.text} Now tap the steps in the order they happen.`,
    visual:null,
    displayChoices: shuffle(item.steps).map(s => ({key:s.label, label:s.label, emoji:s.emoji})),
    targetKeys: order,
    hintText:`Listen again: ${item.text}`,
    explanation:`The order is: ${order.map((o,i) => `${i+1}) ${o}`).join(', ')}.`
  };
}

const GENERATORS = {
  1:genFollow, 2:genMatch, 3:genCategory, 4:genTwoStep, 5:genSentence,
  6:genOrder, 7:genSocial, 8:genPassage, 9:genBuildSentence, 10:genMissions
};

function newItem(skillId){
  const skill = getSkill(skillId);
  state.currentItem = GENERATORS[skillId](skill);
  state.wrongAttemptsThisItem = 0;
  state.hintUsedThisItem = false;
  state.progress = [];
  state.itemLocked = false;
  state.itemStartTime = Date.now();
}

/* =========================================================
   GAME LOGIC
   ========================================================= */
function recordAttempt(skillId, wasCorrect, gains){
  const skill = getSkill(skillId);
  skill.attempts++;
  let deltaMs = 0;
  if(state.itemStartTime){ deltaMs = Date.now() - state.itemStartTime; skill.timeSpentMs += deltaMs; }
  logEvent({
    skillId, skillName: skill.name, tier: skill.tier,
    correct: wasCorrect, hintUsed: state.hintUsedThisItem,
    wrongAttemptsOnItem: state.wrongAttemptsThisItem, timeMs: deltaMs,
    xpGain: gains.xpGain, coinGain: gains.coinGain,
    streak: state.streak, level: level()
  });
  if(wasCorrect){
    skill.correct++;
    skill.correctInRow++;
    skill.wrongInRow = 0;
    if(skill.correctInRow >= 4 && skill.tier < 4){
      skill.tier++;
      skill.correctInRow = 0;
      toast(`Nice work — leveling up this skill!`);
    } else if(skill.correctInRow >= 4 && skill.tier === 4){
      skill.mastered = true;
      unlockNext(skillId);
      toast(`${skill.name} mastered! New skill unlocked.`);
    }
  } else {
    skill.wrongInRow++;
    skill.correctInRow = 0;
    if(skill.wrongInRow >= 3 && skill.tier > 1){
      skill.tier--;
      skill.wrongInRow = 0;
    }
  }
}

function unlockNext(masteredId){
  const idx = SKILLS_META.findIndex(s => s.id === masteredId);
  if(idx >= 0 && idx+1 < state.skills.length){
    state.skills[idx+1].unlocked = true;
  }
}

function onCorrect(){
  const usedHint = state.hintUsedThisItem;
  const xpGain = usedHint ? 5 : 10;
  state.xp += xpGain;
  state.streak++;
  state.bestStreak = Math.max(state.bestStreak, state.streak);
  let coinGain = 1;
  if(state.streak > 0 && state.streak % 5 === 0){ coinGain += 2; }
  state.coins += coinGain;
  state.correctSinceBreakCheck++;
  recordAttempt(state.currentSkillId, true, {xpGain, coinGain});
  state.itemLocked = true;
}

function onWrong(){
  state.streak = 0;
  state.wrongAttemptsThisItem++;
  if(state.wrongAttemptsThisItem < 2){
    recordAttempt(state.currentSkillId, false, {xpGain:0, coinGain:0});
  }
}

function useHint(){
  if(!state.currentItem || state.itemLocked) return;
  state.hintUsedThisItem = true;
  const skill = getSkill(state.currentSkillId);
  skill.hintsUsed++;
  speak(state.currentItem.hintText);
  render();
}

let toastTimer = null;
function toast(msg){
  state.toast = msg;
  render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { state.toast = null; render(); }, 2600);
}

/* =========================================================
   RENDER
   ========================================================= */
const app = document.getElementById('app');

/* =========================================================
   GAME STATE PERSISTENCE — resume where he left off, using
   localStorage. This is separate from the CSV history logs above:
   it just remembers his current level/XP/coins/skill tiers so the
   game doesn't restart from zero every time the page loads. Works
   in every browser, with no folder connection required.
   ========================================================= */
const SAVE_KEY = 'wordQuestSave';

function loadGameState(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return;
    const saved = JSON.parse(raw);
    if(typeof saved.xp === 'number') state.xp = saved.xp;
    if(typeof saved.coins === 'number') state.coins = saved.coins;
    if(typeof saved.bestStreak === 'number') state.bestStreak = saved.bestStreak;
    if(typeof saved.plainLanguage === 'boolean') state.plainLanguage = saved.plainLanguage;
    if(Array.isArray(saved.skills)){
      saved.skills.forEach(savedSkill => {
        const skill = getSkill(savedSkill.id);
        if(!skill) return;
        skill.tier = savedSkill.tier ?? skill.tier;
        skill.correctInRow = savedSkill.correctInRow ?? 0;
        skill.wrongInRow = savedSkill.wrongInRow ?? 0;
        skill.unlocked = savedSkill.unlocked ?? skill.unlocked;
        skill.mastered = savedSkill.mastered ?? skill.mastered;
        skill.attempts = savedSkill.attempts ?? 0;
        skill.correct = savedSkill.correct ?? 0;
        skill.hintsUsed = savedSkill.hintsUsed ?? 0;
        skill.timeSpentMs = savedSkill.timeSpentMs ?? 0;
      });
    }
  } catch(e){ console.warn('Word Quest: could not load saved progress', e); }
}

function saveGameState(){
  try{
    const data = {
      xp: state.xp, coins: state.coins, bestStreak: state.bestStreak,
      plainLanguage: state.plainLanguage,
      skills: state.skills.map(s => ({
        id: s.id, tier: s.tier, correctInRow: s.correctInRow, wrongInRow: s.wrongInRow,
        unlocked: s.unlocked, mastered: s.mastered, attempts: s.attempts, correct: s.correct,
        hintsUsed: s.hintsUsed, timeSpentMs: s.timeSpentMs
      })),
      savedAt: new Date().toISOString()
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    // read it straight back to prove the write actually landed, not just that setItem didn't throw
    const readBack = localStorage.getItem(SAVE_KEY);
    state.saveOk = !!readBack && JSON.parse(readBack).xp === state.xp;
    state.lastSavedAt = data.savedAt;
  } catch(e){
    state.saveOk = false;
    console.warn('Word Quest: could not save progress', e);
  }
}

function resetGameState(){
  try{ localStorage.removeItem(SAVE_KEY); } catch(e){}
  state.xp = 0; state.coins = 0; state.bestStreak = 0; state.streak = 0;
  state.skills = SKILLS_META.map(freshSkillState);
  state.currentSkillId = null; state.currentItem = null;
  state.sessionStartTime = Date.now();
  state.screen = 'start';
  toast('Progress reset.');
  render();
}

function render(){
  let html = '';
  if(state.screen !== 'start'){
    html += renderStatusBar();
  }
  html += '<main>';
  switch(state.screen){
    case 'start': html += renderStart(); break;
    case 'map': html += renderMap(); break;
    case 'session': html += renderSession(); break;
    case 'summary': html += renderSummary(); break;
    case 'settings': html += renderSettings(); break;
  }
  html += '</main>';
  if(state.toast){ html += `<div class="toast">${esc(state.toast)}</div>`; }
  if(state.showBreakModal){ html += renderBreakModal(); }
  app.innerHTML = html;
  attachHandlers();
  saveGameState();
}

function renderStatusBar(){
  return `
  <header class="status-bar">
    <div class="stat"><span class="level-pill">Lv ${level()}</span></div>
    <div class="stat">⭐ <b>${state.xp}</b> XP</div>
    <div class="stat">🪙 <b>${state.coins}</b></div>
    <div class="stat">🔥 <b>${state.streak}</b></div>
    <button class="icon-btn" data-action="settings" aria-label="Settings">⚙️</button>
  </header>`;
}

function renderStart(){
  return `
    <div style="padding-top:14%; display:flex; flex-direction:column; gap:22px; align-items:center; text-align:center;">
      <div style="font-size:3.4rem;">🎮</div>
      <h1 class="headline">Word Quest</h1>
      <p class="subline">A reading and listening game. No tests. No grades. Just levels to unlock.</p>
      <div style="width:100%; display:flex; flex-direction:column; gap:12px;">
        <button class="big-btn" data-action="start-map">Ready to play?</button>
      </div>
    </div>`;
}

function renderMap(){
  const cards = state.skills.map(s => {
    let cls = 'skill-card';
    let tag = '';
    if(s.mastered){ cls += ' mastered'; tag = '✓ Mastered'; }
    else if(!s.unlocked){ cls += ' locked'; tag = 'Locked'; }
    else { cls += ' current'; tag = `Tier ${s.tier} of 4`; }
    if(!s.real){ tag = s.unlocked ? 'Coming soon' : 'Locked'; }
    const clickable = s.unlocked && s.real;
    return `
      <button class="${cls}" ${clickable ? `data-action="play-skill" data-id="${s.id}"` : 'disabled'} aria-label="${esc(s.name)}">
        <div class="emoji">${s.icon}</div>
        <div class="name">${esc(s.name)}</div>
        <div class="tag">${esc(tag)}</div>
      </button>`;
  }).join('');
  return `
    <h2 class="headline">Pick a game</h2>
    <p class="subline">Locked ones open once the one before is mastered.</p>
    <div class="skill-grid">${cards}</div>
    <button class="big-btn ghost" data-action="go-start">Back</button>`;
}

function renderChoiceButton(c, item){
  let stateCls = '';
  let disabled = '';
  let badge = '';
  if(item.type === 'sequence'){
    const doneIdx = state.progress.indexOf(c.key);
    if(doneIdx > -1){
      stateCls = 'done';
      disabled = 'disabled';
      badge = `<span class="step-badge">${doneIdx+1}</span>`;
    }
  }
  const emoji = c.emoji ? `<span class="em">${c.emoji}</span>` : '';
  return `<button class="choice-btn ${stateCls}" data-action="choose" data-key="${esc(c.key)}" ${disabled}>${emoji}<span>${esc(c.label)}</span>${badge}</button>`;
}

function renderSession(){
  const skill = getSkill(state.currentSkillId);
  const item = state.currentItem;
  if(!item) return '';

  const choicesHtml = item.displayChoices.map(c => renderChoiceButton(c, item)).join('');
  const visualHtml = item.visual ? item.visual : '';

  let feedback = '';
  if(state.itemLocked){
    feedback = `<div class="feedback-banner good">✅ Correct! Great job.</div>`;
  } else if(state.wrongAttemptsThisItem >= 2){
    feedback = `<div class="walkthrough">
      <strong>No rush — let's break it down together.</strong><br>${esc(item.explanation)}
    </div>`;
  } else if(state.wrongAttemptsThisItem === 1){
    feedback = `<div class="feedback-banner retry">Not quite — here's what happened: that wasn't it. Want a hint, or try again?</div>`;
  }

  let actionButtons = '';
  if(state.itemLocked){
    actionButtons = `<button class="big-btn" data-action="continue">Continue</button>`;
  } else if(state.wrongAttemptsThisItem >= 2){
    actionButtons = `<button class="big-btn" data-action="retry-item">Try again</button>`;
  } else {
    actionButtons = `<button class="big-btn ghost" data-action="hint">Get a hint</button>`;
  }

  return `
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <span class="stat">${skill.icon} ${esc(skill.name)}</span>
        <button class="link-btn" data-action="end-session">End session</button>
      </div>
      <div class="prompt-row">
        <div class="prompt-text">${esc(item.promptText)}</div>
        <button class="replay-btn" data-action="replay" aria-label="Replay audio">🔊</button>
      </div>
      ${visualHtml}
      <div class="choices">${choicesHtml}</div>
      ${feedback ? `<div style="margin-top:14px;">${feedback}</div>` : ''}
      <div style="margin-top:16px;">${actionButtons}</div>
    </div>`;
}

function renderBreakModal(){
  return `
    <div class="overlay">
      <div class="card" style="text-align:center;">
        <div style="font-size:2.4rem; margin-bottom:6px;">🌤️</div>
        <h3 style="margin-bottom:10px;">Five in a row!</h3>
        <p class="subline" style="margin-bottom:18px;">No rush. Keep going, or take a break?</p>
        <div class="btn-row">
          <button class="big-btn secondary" data-action="take-break">Take a break</button>
          <button class="big-btn" data-action="keep-going">Keep going</button>
        </div>
      </div>
    </div>`;
}

function renderSummary(){
  const totalMinutes = Math.max(1, Math.round((Date.now() - state.sessionStartTime) / 60000));
  const rows = state.skills.filter(s => s.attempts > 0).map(s => {
    const acc = s.attempts ? Math.round((s.correct/s.attempts)*100) : 0;
    return `<div class="skill-report-row"><span>${s.icon} ${esc(s.name)}</span><span>${acc}% · ${s.attempts} tries</span></div>`;
  }).join('') || `<p class="subline">No games played yet this session.</p>`;

  let logNote;
  if(state.logFolderReady){
    logNote = `<p class="footnote">✅ Auto-saved to folder "${esc(state.logFolderName)}"</p>`;
  } else if(!supportsFolderLogging){
    logNote = `<p class="footnote">Automatic saving needs Chrome or Edge on this device.</p>`;
  } else if(state.pendingHandle){
    logNote = `<p class="footnote">Not currently saving to "${esc(state.logFolderName)}" — <button class="link-btn" data-action="reconnect-log">reconnect</button>.</p>`;
  } else {
    logNote = `<p class="footnote">Not saving automatically yet — <button class="link-btn" data-action="connect-log">connect a folder</button>.</p>`;
  }

  return `
    <h2 class="headline">Session complete</h2>
    <div class="summary-stat-grid">
      <div class="summary-stat"><div class="num">${state.xp}</div><div class="lbl">Total XP</div></div>
      <div class="summary-stat"><div class="num">Lv ${level()}</div><div class="lbl">Level</div></div>
      <div class="summary-stat"><div class="num">${state.coins}</div><div class="lbl">Coins</div></div>
      <div class="summary-stat"><div class="num">${state.bestStreak}</div><div class="lbl">Best streak</div></div>
    </div>
    <div class="card">
      <h3 style="margin-bottom:8px;">How each game went</h3>
      ${rows}
    </div>
    <p class="footnote">Played for about ${totalMinutes} minute${totalMinutes===1?'':'s'} this session.</p>
    ${logNote}
    <button class="big-btn" data-action="start-map">Play again</button>`;
}

function renderSettings(){
  let logRow;
  if(!supportsFolderLogging){
    logRow = `Automatic saving needs Chrome or Edge on this device.`;
  } else if(state.logFolderReady){
    logRow = `Auto-saving every answer to <b>${esc(state.logFolderName)}</b>. <button class="link-btn" data-action="connect-log">Change folder</button>`;
  } else if(state.pendingHandle){
    logRow = `Was saving to <b>${esc(state.logFolderName)}</b>, but this browser needs a click to reconnect. <button class="link-btn" data-action="reconnect-log">Reconnect</button>`;
  } else {
    logRow = `Not connected yet. <button class="link-btn" data-action="connect-log">Connect a folder</button> to save progress automatically every time he plays.`;
  }
  return `
    <h2 class="headline">Settings</h2>
    <div class="settings-panel">
      <div class="setting-row">
        <div>
          <div class="label">Plain language mode</div>
          <div class="desc">No idioms or sarcasm — literal words only.</div>
        </div>
        <button class="switch ${state.plainLanguage ? 'on' : ''}" data-action="toggle-plain" aria-label="Toggle plain language mode"></button>
      </div>
      <div class="setting-row">
        <div>
          <div class="label">Read prompts aloud</div>
          <div class="desc">Every prompt is read aloud automatically. Tap 🔊 to hear it again anytime.</div>
        </div>
        <span class="stat">Always on</span>
      </div>
      <div class="setting-row">
        <div>
          <div class="label">Progress logging</div>
          <div class="desc">${logRow}</div>
        </div>
      </div>
      <div class="setting-row">
        <div>
          <div class="label">Game progress on this device</div>
          <div class="desc">Level, XP, coins, and skill tiers are saved automatically in this browser, so he picks up where he left off next time. <button class="link-btn" data-action="reset-progress">Reset all progress</button></div>
          <div class="desc" style="margin-top:6px;">${
            state.saveOk === false
              ? '⚠️ Saving is currently failing in this browser (see console for details) — progress will NOT carry over.'
              : state.lastSavedAt
                ? `✅ Last saved: ${new Date(state.lastSavedAt).toLocaleTimeString()}`
                : 'Not saved yet.'
          }</div>
        </div>
      </div>
    </div>
    <button class="big-btn ghost" data-action="go-back">Back</button>
    <p class="footnote">Word Quest adapts difficulty per skill area based on real answers, not age or grade — and tracks accuracy, retries, and time so progress can be reviewed by a parent or specialist.</p>`;
}

/* =========================================================
   HANDLERS
   ========================================================= */
function attachHandlers(){
  app.querySelectorAll('[data-action]').forEach(el => {
    el.addEventListener('click', onAction);
  });
}

function onAction(e){
  const action = e.currentTarget.dataset.action;
  switch(action){
    case 'start-map': state.screen = 'map'; render(); break;
    case 'go-start': state.screen = 'start'; render(); break;
    case 'go-back': state.screen = 'map'; render(); break;
    case 'settings': state.screen = 'settings'; render(); break;
    case 'play-skill': startSkill(parseInt(e.currentTarget.dataset.id, 10)); break;
    case 'replay': speak(state.currentItem.promptText); break;
    case 'hint': useHint(); break;
    case 'choose': handleChoice(e.currentTarget.dataset.key); break;
    case 'retry-item': {
      state.wrongAttemptsThisItem = 0;
      state.progress = [];
      render();
      speak(state.currentItem.promptText);
      break;
    }
    case 'continue': advanceAfterCorrect(); break;
    case 'end-session': goToSummary(); break;
    case 'take-break': state.showBreakModal = false; goToSummary(); break;
    case 'keep-going': state.showBreakModal = false; state.correctSinceBreakCheck = 0; render(); break;
    case 'toggle-plain': state.plainLanguage = !state.plainLanguage; render(); break;
    case 'reset-progress': {
      if(window.confirm('Reset all progress on this device? This clears his level, XP, coins, and skill tiers. This cannot be undone.')){
        resetGameState();
      }
      break;
    }
    case 'connect-log': chooseLogFolder(); break;
    case 'reconnect-log': reconnectLogFolder(); break;
  }
}

function startSkill(skillId){
  state.currentSkillId = skillId;
  state.screen = 'session';
  newItem(skillId);
  render();
  speak(state.currentItem.promptText);
}

function handleChoice(key){
  if(state.itemLocked) return;
  const item = state.currentItem;

  if(item.type === 'single'){
    if(key === item.correctKey){
      onCorrect();
    } else {
      onWrong();
    }
  } else if(item.type === 'sequence'){
    const nextExpected = item.targetKeys[state.progress.length];
    if(key === nextExpected){
      state.progress.push(key);
      if(state.progress.length === item.targetKeys.length){
        onCorrect();
      }
    } else {
      state.progress = [];
      onWrong();
    }
  }
  render();
}

function advanceAfterCorrect(){
  if(state.correctSinceBreakCheck >= 5){
    state.correctSinceBreakCheck = 0;
    state.showBreakModal = true;
    render();
    return;
  }
  newItem(state.currentSkillId);
  render();
  speak(state.currentItem.promptText);
}

function buildSummary(){
  const durationMinutes = Math.max(1, Math.round((Date.now() - state.sessionStartTime) / 60000));
  return {
    durationMinutes,
    xp: state.xp, level: level(), coins: state.coins, bestStreak: state.bestStreak,
    skills: state.skills.filter(s => s.attempts > 0).map(s => ({
      name: s.name, tier: s.tier, mastered: s.mastered,
      attempts: s.attempts, correct: s.correct,
      accuracy: s.attempts ? Math.round((s.correct/s.attempts)*100) : null,
      hintsUsed: s.hintsUsed, timeSpentSeconds: Math.round(s.timeSpentMs/1000)
    }))
  };
}

function goToSummary(){
  logSession(buildSummary());
  state.screen = 'summary';
  render();
}

loadGameState();
render();
initLogging();
</script>
</body>
</html>
